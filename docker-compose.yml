# Local container stack for the PsychSift app tier.
#
# `docker compose up --build` starts ONLY the app. The ingestion worker sits
# behind the opt-in `worker` profile because it claims jobs from whatever
# Supabase project the credentials point at: with production keys in
# .env.local, an unprofiled worker would start consuming the live ingestion
# queue. Start it only with explicit connected-workload approval:
#   docker compose --env-file .env.local --profile worker up --build
#
# NEXT_PUBLIC_SUPABASE_URL has no default on purpose: Compose fails fast when
# it is missing instead of silently building against the production project.
# `${VAR}` interpolation reads the shell and `.env`, not `env_file`, so pass
# the approved values explicitly, e.g.:
#   docker compose --env-file .env.local up --build

services:
  # PsychSift Next.js app tier
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL to the approved Supabase project URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY to the approved Supabase publishable key}
        # Non-secret staging identity: without it the browser-side project
        # guard rejects a staging URL as a production mismatch.
        NEXT_PUBLIC_SUPABASE_STAGING_PROJECT_REF: ${NEXT_PUBLIC_SUPABASE_STAGING_PROJECT_REF:-}
        NEXT_PUBLIC_SUPABASE_STAGING_PROJECT_NAME: ${NEXT_PUBLIC_SUPABASE_STAGING_PROJECT_NAME:-}
        MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${NEXT_PUBLIC_MAX_UPLOAD_MB:-}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      # Server-side secrets (never baked into the image)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL to the approved Supabase project URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    env_file:
      - path: .env.local
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - psychsift

  # PsychSift Node + Python OCR ingestion worker (opt-in: --profile worker)
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      # Server-side secrets (never baked into the image)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Binds worker/health.ts's /health server inside the container only
      # (no published port); used by the healthcheck below. Deliberately not
      # a common API port, so sibling-repo port-isolation audits (Medications
      # serves its API on the usual 80xx port) do not flag a collision.
      WORKER_HEALTH_PORT: "3901"
      # Worker-specific tuning (from .env.example defaults)
      WORKER_DOCUMENT_EXTRACTOR_MODE: ${WORKER_DOCUMENT_EXTRACTOR_MODE:-legacy}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_CLAIM_BATCH_SIZE: ${WORKER_CLAIM_BATCH_SIZE:-5}
      WORKER_STALE_CLAIM_WINDOW_MS: ${WORKER_STALE_CLAIM_WINDOW_MS:-60000}
    env_file:
      - path: .env.local
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3901/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - psychsift

networks:
  psychsift:
    driver: bridge
