version: "3.8"

services:
  # PsychSift Next.js app tier
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Build args are optional; pass them only if you need to customize the build
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://sjrfecxgysukkwxsowpy.supabase.co}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-placeholder-build-publishable-key}
        MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
        NEXT_PUBLIC_MAX_UPLOAD_MB: ${NEXT_PUBLIC_MAX_UPLOAD_MB:-}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      # Server-side secrets (never baked into the image)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    env_file:
      - .env.local
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - psychsift
    depends_on:
      - worker

  # PsychSift Node + Python OCR ingestion worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      NODE_ENV: production
      # Server-side secrets (never baked into the image)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Worker-specific tuning (from .env.example defaults)
      WORKER_DOCUMENT_EXTRACTOR_MODE: ${WORKER_DOCUMENT_EXTRACTOR_MODE:-legacy}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_CLAIM_BATCH_SIZE: ${WORKER_CLAIM_BATCH_SIZE:-5}
      WORKER_STALE_CLAIM_WINDOW_MS: ${WORKER_STALE_CLAIM_WINDOW_MS:-60000}
      # Internal-only listener for the Docker HEALTHCHECK; no host port is needed.
      WORKER_HEALTH_PORT: 8000
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - psychsift
    # The worker runs long-poll ingestion tasks; no exposed port needed
    # but you can add `expose: ['8000']` for internal metrics if added later

networks:
  psychsift:
    driver: bridge
