name: Setup pinned Chromium for Lighthouse
description: >
  Install Playwright's managed Chromium and export CHROME_PATH plus
  PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH, so every Lighthouse job in this repository measures with the
  same browser build for a given commit.

# The Lighthouse budget used to drive whatever Chrome ships in the ubuntu-24.04 runner image
# (matching live-web-vitals.yml, which measures a live domain and isn't graded against a
# committed baseline). That ambient browser is NOT pinned per commit — the runner fleet was
# observed serving HeadlessChrome/150 and /151 to jobs minutes apart on 2026-08-07 — so the
# baseline comparator treated the version drift as "evidence incomplete" and failed closed
# (by design: a browser bump is otherwise indistinguishable from a real regression).
# Refreshing the baseline for whichever version showed up bought a few hours before the next
# mismatched runner failed it again (#1690).
#
# Pin Playwright's own managed Chromium instead, the same binary the Production UI / Visual
# baselines jobs already use, cached by lockfile hash so it is identical across every runner
# for a given commit. run-lighthouse-budget.mjs already honours
# CHROME_PATH/PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH.
#
# This lives in a composite action rather than being duplicated per job for one reason: the
# measuring job and the baseline-refresh job MUST resolve the same executable. If they drift,
# the refreshed baseline records a browser other than the one that will grade against it, and
# the gate goes permanently red again — exactly the failure this action exists to end.

runs:
  using: composite
  steps:
    - name: Restore Chromium browser cache
      id: pw-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-chromium-${{ runner.os }}-

    # The browser archive is cached, but apt libraries are runner-local and must be
    # installed even on a browser-cache hit. `install-deps` shells out to `apt-get
    # update`, which occasionally hangs indefinitely against the runner's default
    # azure.archive.ubuntu.com mirror (no timeout of its own) and silently burns the
    # whole job until something external cancels it. Rewrite the flaky azure mirror
    # to archive.ubuntu.com, set bounded APT timeouts, and bound each attempt with
    # retries so a stuck mirror fails fast and recovers instead of stalling the job.
    - name: Install Chromium
      shell: bash
      run: |
        if command -v sudo >/dev/null 2>&1; then
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo mkdir -p /etc/apt/apt.conf.d
          sudo tee /etc/apt/apt.conf.d/99flaky-mirror-resilience >/dev/null << 'EOF'
        Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        EOF
        fi
        install_chromium() {
          # Fail the attempt if install-deps fails, rather than letting the browser
          # download that follows mask it (see release-browser-matrix in ci.yml).
          set -e
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
        }
        for attempt in 1 2 3; do
          if timeout 180 bash -c "$(declare -f install_chromium); install_chromium"; then
            exit 0
          fi
          echo "Chromium install attempt $attempt timed out or failed, retrying..." >&2
          # A timed-out attempt can leave its root apt-get holding the apt lock, or dpkg
          # half-configured; clear both (recovery bounded) before the next attempt.
          if command -v sudo >/dev/null 2>&1; then
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 2
            sudo timeout 120 dpkg --configure -a || true
          fi
          sleep 5
        done
        exit 1

    - name: Pin the Chromium executable path
      shell: bash
      run: |
        chromium_path="$(node -e "console.log(require('playwright').chromium.executablePath())")"
        {
          echo "CHROME_PATH=$chromium_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path"
        } >> "$GITHUB_ENV"
