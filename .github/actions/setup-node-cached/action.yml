name: Setup Node with npm cache
description: >-
  Set up Node from .nvmrc, restore npm's download cache, and run the immutable
  clean install on every fresh runner. node_modules is never restored, so each
  job proves package.json and package-lock.json can reproduce the toolchain.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: npm
        # .nvmrc is part of the key so this entry is distinct from the
        # package-lock-only key that setup-node's automatic package-manager
        # cache (triggered by package.json "packageManager") writes from jobs
        # that never run npm ci. Those jobs saved an empty ~/.npm (686 B)
        # under the shared key first, and a primary-key hit is never re-saved,
        # so every npm ci downloaded all packages from the registry.
        cache-dependency-path: |
          package-lock.json
          .nvmrc

    - name: Install dependencies
      shell: bash
      run: npm ci --include=dev
