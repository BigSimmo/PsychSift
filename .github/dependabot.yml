version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 5
    # Batch low-risk updates so a solo maintainer reviews a couple of grouped PRs
    # instead of up to ~5/week each triggering full CI. Majors stay individual —
    # each major deserves its own review (per the AGENTS.md dependency protocol).
    groups:
      npm-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Hold the TypeScript major (7.x is the native Go port): typescript-eslint /
    # eslint-config-next do not support the native port yet — their peer range
    # caps typescript at <6.1.0, so a major bump breaks the type-aware lint gate.
    # The repo keeps a separate @typescript/typescript6 for the compiler API.
    # Remove this once the lint toolchain ships native-port support.
    # Context: merged #1014 / closed #990.
    #
    # Hold the ESLint major (10.x): eslint-config-next@16.2.10 bundles an
    # eslint-plugin-react that still calls the removed context.getFilename() API,
    # so ESLint 10 crashes `npm run lint` outright ("TypeError: ... getFilename is
    # not a function"). Same shape as the TypeScript hold — the lint toolchain is
    # not yet ESLint-10-ready. Remove once eslint-config-next supports ESLint 10.
    # Context: closed #1022.
    #
    # Hold the @types/node major: the types must track engines.node (24.x —
    # .nvmrc, both Dockerfiles and the Railway images all run Node 24), or tsc
    # accepts an API the deployed runtime does not have. Dependabot #549 is how
    # the current 26.x line arrived; the pin back to 24.x is tracked in
    # docs/framework-dependency-modernization-checklist.md (audit L20).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 5
    # One batched PR for all action SHA bumps keeps pinned versions uniform across
    # workflows/composites (mitigates the action-version-skew finding) and keeps
    # check:github-actions green in a single review.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ["*"]
    # Hold the node base-image major: engines.node is ">=24.15.0 <25" (package.json), and
    # both Dockerfiles pin FROM node:24-bookworm-slim. A major bump to node:25 would build
    # an image the app's own engine-strict check rejects at container start. Minor/patch
    # digest updates within the 24.x line are unaffected.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The ingestion worker parses attacker-supplied PDFs and images with
  # PyMuPDF, Pillow, pytesseract and docling. Without these two entries nothing
  # in the repo reports a published CVE against a pinned parser (audit M20).
  - package-ecosystem: "pip"
    directory: "/worker/python"
    # Hash-pinned by pip-compile: a bump must regenerate the hashes with
    # `npm run generate:worker-python-lock`, then pass
    # `npm run check:worker-python-locks:static`, rather than edit a version.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 2
    # medspacy 1.3.1 needs spacy<3.8 on Python 3.11 (the production worker
    # image), so a spacy 3.8 bump and the thinc/blis/confection/weasel majors
    # that move with it make `pip install --require-hashes` fail (see #3704,
    # #3705). Keep these ignores until medspacy is upgraded. Note this also
    # holds back these packages in requirements-cloud.txt (Python 3.12).
    ignore:
      - dependency-name: "spacy"
        versions: [">=3.8"]
      - dependency-name: "thinc"
        versions: [">=8.3"]
      - dependency-name: "blis"
        versions: [">=1.0"]
      - dependency-name: "confection"
        versions: [">=1.0"]
      - dependency-name: "weasel"
        versions: [">=1.0"]
    groups:
      worker-python:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/eval/docling"
    # Hash-pinned Gate B lab lock that Dockerfile.worker builds the docling venv
    # from; regenerate per docs/worker-deploy-runbook.md and confirm with
    # `npm run check:worker-python-locks:static` before merging a bump.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Perth"
    open-pull-requests-limit: 2
    groups:
      docling-python:
        patterns: ["*"]
