name: DB canonical zero-storage diagnostic

# Temporary feature-branch diagnostic only. Never merge this replacement.
on:
  push:
    branches: [diag/canonical-db-zero-storage-20261018]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-db-zero-storage-${{ github.run_id }}
  cancel-in-progress: false

env:
  CI: "true"
  SUPABASE_CLI_VERSION: "2.108.0"
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  db-reset-verify:
    name: Migration replay diagnostic
    if: >-
      github.repository == 'BigSimmo/PsychSift' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/diag/canonical-db-zero-storage-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node with all remote caches disabled
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Record exact source and local-only execution scope
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = BigSimmo/PsychSift
          test "${GITHUB_REF}" = refs/heads/diag/canonical-db-zero-storage-20261018
          test ! -f .env
          test ! -f .env.local
          test ! -f supabase/.temp/project-ref
          printf 'DIAGNOSTIC_SOURCE %s\n' "${GITHUB_SHA}"
          sha256sum supabase/schema.sql supabase/roles.sql package-lock.json \
            supabase/applied-migration-hashes.json scripts/generate-drift-manifest.ts \
            scripts/check-drift-manifest-freshness.ts scripts/check-chain-mirror-parity.ts
          docker info --format 'DOCKER_STORAGE_DRIVER {{.Driver}}'
          df -h /

      # Same npm-prefix installation used by the pinned supabase/setup-cli action.
      # Its nested setup-bun action uploads a cache by default, so do not invoke it.
      - name: Install exact CLI and exact project lock on ephemeral disk only
        run: |
          set -euo pipefail
          cli_root="${RUNNER_TEMP}/supabase-cli-2.108.0"
          npm install --prefix "${cli_root}" --omit=dev --include=optional \
            --no-audit --no-fund --no-package-lock --offline=false --bin-links=true \
            "supabase@${SUPABASE_CLI_VERSION}"
          echo "${cli_root}/node_modules/.bin" >> "${GITHUB_PATH}"
          test "$("${cli_root}/node_modules/.bin/supabase" --version)" = "${SUPABASE_CLI_VERSION}"
          npm ci --include=dev --no-audit --no-fund

      - name: Create isolated emulator network and isolate bare-image docker runs
        run: |
          set -euo pipefail
          db_network="psychsift-db-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker network create --internal --label psychsift.task=canonical-db-zero-storage "${db_network}"
          test "$(docker network inspect --format '{{.Internal}}' "${db_network}")" = true
          echo "DB_DIAGNOSTIC_NETWORK=${db_network}" >> "${GITHUB_ENV}"
          echo "DB_DIAGNOSTIC_REAL_DOCKER=$(command -v docker)" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/db-diagnostic-bin"
          cat > "${RUNNER_TEMP}/db-diagnostic-bin/docker" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == run ]]; then
            shift
            for argument in "$@"; do
              case "${argument}" in --network|--network=*) exit 2;; esac
            done
            exec "${DB_DIAGNOSTIC_REAL_DOCKER}" run --network "${DB_DIAGNOSTIC_NETWORK}" "$@"
          fi
          exec "${DB_DIAGNOSTIC_REAL_DOCKER}" "$@"
          SH
          chmod 700 "${RUNNER_TEMP}/db-diagnostic-bin/docker"
          echo "${RUNNER_TEMP}/db-diagnostic-bin" >> "${GITHUB_PATH}"
          cat > "${RUNNER_TEMP}/db-loopback-relay.cjs" <<'JS'
          const net = require('node:net');
          const { execFileSync } = require('node:child_process');
          const sockets = new Set();
          let server, polling;
          const deadline = Date.now() + 300000;
          function start(target) {
            if (net.isIP(target) !== 4) throw new Error('Expected one inspected IPv4 DB endpoint');
            clearInterval(polling);
            server = net.createServer(client => {
              const upstream = net.connect({ host: target, port: 5432 });
              sockets.add(client); sockets.add(upstream);
              const close = () => { client.destroy(); upstream.destroy(); sockets.delete(client); sockets.delete(upstream); };
              client.on('error', close); upstream.on('error', close);
              upstream.setTimeout(10000, close);
              upstream.once('connect', () => upstream.setTimeout(0));
              client.once('close', close); upstream.once('close', close);
              client.pipe(upstream); upstream.pipe(client);
            });
            server.maxConnections = 32;
            server.once('error', error => { console.error(error.code); process.exit(1); });
            server.listen(54322, '127.0.0.1', () => console.log('RELAY_LISTENING_127.0.0.1_54322_TO_INSPECTED_DB_5432'));
          }
          function discover() {
            if (Date.now() >= deadline) throw new Error('No task-internal local DB appeared within300seconds');
            const ids = execFileSync(process.env.DB_DIAGNOSTIC_REAL_DOCKER, ['ps','-q','--filter','name=^supabase_db_'], { encoding:'utf8',timeout:5000 }).trim().split(/\s+/).filter(Boolean);
            if (!ids.length) return;
            if (ids.length !== 1) throw new Error('Expected exactly one local emulator DB');
            const state = JSON.parse(execFileSync(process.env.DB_DIAGNOSTIC_REAL_DOCKER, ['inspect',ids[0]], { encoding:'utf8',timeout:5000 }))[0];
            const networks = state.NetworkSettings.Networks;
            if (JSON.stringify(Object.keys(networks)) !== JSON.stringify([process.env.DB_DIAGNOSTIC_NETWORK])) throw new Error('DB escaped expected internal network');
            const target = networks[process.env.DB_DIAGNOSTIC_NETWORK].IPAddress;
            if (target) start(target);
          }
          const stop = () => { clearInterval(polling); for (const socket of sockets) socket.destroy(); if (server) server.close(); process.exit(0); };
          process.on('SIGTERM', stop); process.on('SIGINT', stop);
          if (process.argv[2] === 'discover') { discover(); if (!server) polling = setInterval(discover,250); }
          else start(process.argv[2]);
          JS

      - name: Pull original immutable default image
        id: original-image
        run: docker pull supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83

      - name: Prove authenticated internal Postgres TCP and loopback relay
        timeout-minutes: 2
        run: |
          set -euo pipefail
          probe="psychsift-db-route-${GITHUB_RUN_ID}"
          relay_pid=""
          finish_probe() {
            docker inspect --format 'PROBE_STATE {{json .State}} PROBE_NETWORKS {{json .NetworkSettings.Networks}} PROBE_PORTS {{json .NetworkSettings.Ports}}' "${probe}" || true
            docker logs --tail 40 "${probe}" 2>&1 | sed -E '/[Pp]assword|[Ss]ecret|[Tt]oken|[Jj][Ww][Tt]/d' || true
            if test -f "${RUNNER_TEMP}/probe-relay.log"; then
              tail -n 20 "${RUNNER_TEMP}/probe-relay.log" | sed -E '/[Pp]assword|[Ss]ecret|[Tt]oken|[Aa]uthorization|[Jj][Ww][Tt]/d'
            fi
            if test -n "${relay_pid}"; then kill "${relay_pid}" 2>/dev/null || true; wait "${relay_pid}" 2>/dev/null || true; fi
            docker rm -f "${probe}" || true
          }
          trap finish_probe EXIT
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          docker run -d --pull=never --name "${probe}" --label psychsift.task=canonical-db-route \
            -e POSTGRES_PASSWORD -p 127.0.0.1:54322:5432 \
            supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83
          ready=0
          for attempt in $(seq 1 45); do
            if docker exec "${probe}" pg_isready -h 127.0.0.1 -U postgres -q; then ready=$((ready+1)); else ready=0; fi
            if test "${ready}" -ge 5; then break; fi
            sleep 2
          done
          test "${ready}" -ge 5
          test "$(PGPASSWORD="${POSTGRES_PASSWORD}" docker exec -e PGPASSWORD "${probe}" psql -X -h 127.0.0.1 -U postgres -d postgres -tA -v ON_ERROR_STOP=1 -c 'select 1')" = 1
          printf 'PROBE_INSIDE_AUTHENTICATED_TCP_SELECT1_PASS\n'
          port_status=0
          port_output="$(docker port "${probe}" 5432/tcp 2>&1)" || port_status=$?
          printf 'PROBE_EXPECTED_NO_PUBLISHED_PORT status=%s output=%s\n' "${port_status}" "${port_output}"
          test "${port_status}" -eq 1
          test "$(docker inspect --format '{{json .NetworkSettings.Ports}}' "${probe}")" = '{}'
          python3 - <<'PYCODE'
          import errno,socket
          try:
              with socket.create_connection(('127.0.0.1',54322),timeout=2): pass
          except OSError as error:
              assert error.errno==errno.ECONNREFUSED,repr(error)
              print('PROBE_INTERNAL_PUBLISHED_HOST_PORT_REFUSED_WITH_HEALTHY_SQL')
          else: raise AssertionError('Host mapping works; the assumed isolation failure was not reproduced')
          PYCODE
          target="$(docker inspect --format "{{(index .NetworkSettings.Networks \"${DB_DIAGNOSTIC_NETWORK}\").IPAddress}}" "${probe}")"
          node "${RUNNER_TEMP}/db-loopback-relay.cjs" "${target}" > "${RUNNER_TEMP}/probe-relay.log" 2>&1 &
          relay_pid=$!
          for attempt in $(seq 1 20); do
            kill -0 "${relay_pid}"
            if grep -q '^RELAY_LISTENING_' "${RUNNER_TEMP}/probe-relay.log"; then break; fi
            sleep 0.1
          done
          grep '^RELAY_LISTENING_' "${RUNNER_TEMP}/probe-relay.log"
          python3 - <<'PYCODE'
          import socket
          with socket.create_connection(('127.0.0.1',54322),timeout=2) as connection:
              connection.sendall(bytes.fromhex('0000000804d2162f'))
              assert connection.recv(1) in (b'S',b'N'),'expected a real PostgreSQL SSL negotiation response'
          print('PROBE_HOST_RELAY_REAL_POSTGRES_PROTOCOL_PASS')
          PYCODE

      - name: Start local emulator and bootstrap canonical default ACLs
        run: |
          set -euo pipefail
          bootstrap_dir="$(mktemp -d)"
          mv supabase/roles.sql "${bootstrap_dir}/roles.sql"
          mv supabase/migrations "${bootstrap_dir}/migrations"
          mkdir supabase/migrations
          restore_bootstrap() {
            rmdir supabase/migrations
            mv "${bootstrap_dir}/migrations" supabase/migrations
            mv "${bootstrap_dir}/roles.sql" supabase/roles.sql
          }
          trap restore_bootstrap EXIT
          node "${RUNNER_TEMP}/db-loopback-relay.cjs" discover > "${RUNNER_TEMP}/emulator-relay.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/emulator-relay.pid"
          supabase --network-id "${DB_DIAGNOSTIC_NETWORK}" start
          restore_bootstrap
          trap - EXIT
          docker ps -q > "${RUNNER_TEMP}/diagnostic-container-ids"
          test -s "${RUNNER_TEMP}/diagnostic-container-ids"
          while read -r container_id; do
            docker inspect --format '{{json .NetworkSettings.Networks}}' "${container_id}" \
              | python3 -c 'import json,os,sys; networks=json.load(sys.stdin); assert list(networks)==[os.environ["DB_DIAGNOSTIC_NETWORK"]],networks'
          done < "${RUNNER_TEMP}/diagnostic-container-ids"
          db_container="$(docker ps --format '{{.Names}}' --filter 'name=^supabase_db_' | head -n 1)"
          test -n "${db_container}"
          docker exec -i "${db_container}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/roles.sql

      - name: Verify canonical migration replay
        id: replay
        run: supabase migration up --local

      - name: Run every canonical SQL behaviour test against the chain
        id: sql-tests
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' --filter 'name=^supabase_db_' | head -n 1)"
          test -n "${db_container}"
          for test_file in tests/sql/*.sql; do
            echo "::group::${test_file}"
            docker exec -i "${db_container}" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -q -1 < "${test_file}"
            echo "::endgroup::"
          done

      - name: Regenerate manifest with reviewed exec-only generator and original default image
        id: generate
        run: |
          cp supabase/drift-manifest.json "${RUNNER_TEMP}/committed-drift-manifest.json"
          npm run drift:manifest -- --no-publish

      - name: Verify strict canonical manifest freshness
        id: freshness
        run: |
          npm run check:drift-manifest-freshness -- \
            --committed "${RUNNER_TEMP}/committed-drift-manifest.json" \
            --generated supabase/drift-manifest.json

      # A stale manifest remains a failed job. Capture parity independently so
      # the first diagnostic still proves the chain against the generated mirror.
      - name: Capture canonical chain snapshot even when freshness is red
        id: chain-snapshot
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && steps.sql-tests.outcome == 'success' }}
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' --filter 'name=^supabase_db_' | head -n 1)"
          test -n "${db_container}"
          docker exec -i "${db_container}" psql -U postgres -d postgres -tA -v ON_ERROR_STOP=1 \
            -c 'select public.schema_drift_snapshot()::text;' > "${RUNNER_TEMP}/chain-snapshot.json"
          test -s "${RUNNER_TEMP}/chain-snapshot.json"

      - name: Verify canonical strict chain-mirror parity
        id: parity
        if: ${{ !cancelled() && steps.chain-snapshot.outcome == 'success' }}
        run: |
          npm run check:chain-mirror-parity -- \
            --chain "${RUNNER_TEMP}/chain-snapshot.json" \
            --mirror-manifest supabase/drift-manifest.json --strict

      - name: Emit bounded byte-exact generated manifest through free logs only
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib
          raw=pathlib.Path('supabase/drift-manifest.json').read_bytes()
          assert len(raw)<=2*1024*1024, 'raw manifest exceeds 2MiB log transport bound'
          manifest=json.loads(raw)
          assert manifest['postgres_image']=='supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83'
          assert manifest['generator']=='scripts/generate-drift-manifest.ts'
          packed=gzip.compress(raw,mtime=0)
          assert len(packed)<=512*1024, 'compressed manifest exceeds 512KiB log transport bound'
          encoded=base64.b64encode(packed).decode('ascii')
          chunks=[encoded[i:i+4096] for i in range(0,len(encoded),4096)]
          meta={'version':1,'commit':os.environ['GITHUB_SHA'],'raw_bytes':len(raw),'raw_sha256':hashlib.sha256(raw).hexdigest(),'gzip_bytes':len(packed),'gzip_sha256':hashlib.sha256(packed).hexdigest(),'chunks':len(chunks)}
          print('PSYCHSIFT_MANIFEST_META '+json.dumps(meta,sort_keys=True,separators=(',',':')))
          for index,chunk in enumerate(chunks,1):
            print(f'PSYCHSIFT_MANIFEST_CHUNK {index:04d}/{len(chunks):04d} {chunk}')
          print('PSYCHSIFT_MANIFEST_END '+meta['raw_sha256'])
          PY

      - name: Report actual gate outcomes without accepting failed gates
        if: always()
        env:
          REPLAY: ${{ steps.replay.outcome }}
          SQL_TESTS: ${{ steps.sql-tests.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          FRESHNESS: ${{ steps.freshness.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          print('CANONICAL_DB_GATE_OUTCOMES '+json.dumps({key:os.environ[key] for key in ['REPLAY','SQL_TESTS','GENERATE','FRESHNESS','PARITY']},sort_keys=True))
          PY

      - name: Stop only task-local platform and isolated network
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          supabase stop --no-backup || cleanup_status=$?
          if test -f "${RUNNER_TEMP}/emulator-relay.log"; then
            tail -n 30 "${RUNNER_TEMP}/emulator-relay.log" | sed -E '/[Pp]assword|[Ss]ecret|[Tt]oken|[Aa]uthorization|[Jj][Ww][Tt]/d'
          fi
          if test -f "${RUNNER_TEMP}/emulator-relay.pid"; then
            relay_pid="$(cat "${RUNNER_TEMP}/emulator-relay.pid")"
            if ps -p "${relay_pid}" -o args= | grep -Fq "${RUNNER_TEMP}/db-loopback-relay.cjs discover"; then
              kill "${relay_pid}" 2>/dev/null || true
            fi
          fi
          probe="psychsift-db-route-${GITHUB_RUN_ID}"
          if test "$(docker inspect --format '{{index .Config.Labels "psychsift.task"}}' "${probe}" 2>/dev/null || true)" = canonical-db-route; then
            docker rm -f "${probe}" || cleanup_status=$?
          fi
          if test -n "${DB_DIAGNOSTIC_NETWORK:-}"; then
            docker network rm "${DB_DIAGNOSTIC_NETWORK}" || cleanup_status=$?
          fi
          exit "${cleanup_status}"
