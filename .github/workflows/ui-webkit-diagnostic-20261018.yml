name: UI WebKit isolated diagnostic 20261018

on:
  push:
    branches: [diag/ui-webkit-acceptance-20261018]
    paths:
      - .github/workflows/ui-webkit-diagnostic-20261018.yml

permissions:
  contents: read

concurrency:
  group: ui-webkit-isolated-diagnostic-20261018
  cancel-in-progress: false

jobs:
  webkit-six:
    if: >-
      github.repository == 'BigSimmo/PsychSift' &&
      github.event.repository.private == false &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/diag/ui-webkit-acceptance-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup declared Node without persistent cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Record exact synthetic-only source
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = BigSimmo/PsychSift
          test "${GITHUB_REF}" = refs/heads/diag/ui-webkit-acceptance-20261018
          test ! -f .env
          test ! -f .env.local
          printf 'DIAGNOSTIC_SOURCE %s\n' "${GITHUB_SHA}"
          sha256sum src/app/globals.css tests/ui-phone-scroll-assessments.spec.ts \
            tests/ui-smoke.spec.ts package-lock.json

      - name: Install exact lockfile once
        run: timeout --kill-after=10s 300s npm ci --include=dev

      - name: Install and launch genuine WebKit once
        run: |
          set -euo pipefail
          timeout --kill-after=10s 300s node node_modules/playwright/cli.js install --with-deps webkit
          timeout --kill-after=5s 30s node -e 'require("playwright").webkit.launch().then(browser => browser.close())'

      - name: Six synthetic production-app WebKit cases
        run: >-
          timeout --kill-after=10s 900s
          node scripts/run-playwright.mjs
          tests/ui-phone-scroll-assessments.spec.ts tests/ui-smoke.spec.ts
          --project=mobile-webkit
          --grep='assessment scrolling stays stable in (browser|installed layout), no-preference$|clinical records open with their list beside them from 1024px only at (1024|1440|390|768)px$'
          --reporter=list
          --global-timeout=420000
