name: Live domain monitor

# PT-17 (2026-07-13 external audit): nothing exercised the deployed product
# after release, so a broken domain, dead health probe, or lost route could
# only be discovered by a user. This monitor probes the public domain on a
# schedule with plain unauthenticated GETs — no secrets, no providers beyond
# what any anonymous visitor triggers, and no third-party actions.
#
# A red run is the alert. Deeper answer-SLO probing stays in the ops-digest
# workflow (dispatch-only, secret-gated); this one must stay cheap enough to
# never be worth disabling.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-domain-monitor
  cancel-in-progress: false

jobs:
  probe:
    name: Probe public domain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      findings: ${{ steps.findings.outputs.findings }}
    env:
      # Repository variable overrides the default (e.g. a staging cutover).
      LIVE_DOMAIN_URL: ${{ vars.LIVE_DOMAIN_URL || 'https://psychiatry.tools' }}
    steps:
      - name: Root renders the app shell
        id: root_shell
        run: |
          set -euo pipefail
          body="$(curl -sSL --fail --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$LIVE_DOMAIN_URL/")"
          # The dashboard hydrates client-side (ssr:false), so assert on the
          # server-rendered document title, not client-rendered brand text.
          echo "$body" | grep -Eq '<title>[^<]*PsychSift[^<]*</title>' || {
            echo "::error::Root responded but does not serve the PsychSift document"
            echo "First 300 bytes of response for diagnosis:"
            echo "$body" | head -c 300
            exit 1
          }

      - name: Health endpoint reports ok in live mode
        id: health
        run: |
          set -euo pipefail
          health="$(curl -sSL --fail --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$LIVE_DOMAIN_URL/api/health")"
          echo "$health"
          echo "$health" | grep -q '"status":"ok"' || {
            echo "::error::/api/health did not report status ok"
            exit 1
          }
          echo "$health" | grep -q '"demoMode":false' || {
            echo "::error::/api/health reports demo mode — live configuration lost"
            exit 1
          }

      - name: Key routes stay reachable
        id: routes
        run: |
          set -euo pipefail
          # -L follows the /applications -> /tools canonicalisation either side
          # of that redirect landing, so this list survives route renames.
          for route in /privacy /services /forms /differentials /applications; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$LIVE_DOMAIN_URL$route")"
            echo "$route -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$route returned $code"
              exit 1
            fi
          done

      - name: WWW and TLS answer
        id: www_tls
        run: |
          set -euo pipefail
          # Only meaningful for the canonical production domain; an overridden
          # LIVE_DOMAIN_URL (e.g. staging) has no www alias to assert.
          if [ "$LIVE_DOMAIN_URL" != "https://psychiatry.tools" ]; then
            echo "LIVE_DOMAIN_URL overridden; skipping www alias check"
            exit 0
          fi
          code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "https://www.psychiatry.tools/")"
          echo "www -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::www.psychiatry.tools returned $code"
            exit 1
          fi

      # The check the three-day outage actually needed, and the one nobody had.
      #
      # Between 2026-09-11 and 2026-09-14, 24 consecutive production deploys were rejected at
      # Railway's healthcheck and rolled back. This workflow stayed green throughout. Every probe
      # above passed and each was telling the truth: the domain served the app shell, /api/health
      # answered "ok", live mode was intact. The site was simply serving three-day-old code, and
      # nothing here compared what was DEPLOYED against what had been MERGED. It was found by
      # someone noticing that an expected UI change was missing from the live site.
      #
      # The logic lives in a script rather than inline shell so the metric can be unit-tested. That
      # is not tidiness: the first version of this check measured the age of main's head, which
      # resets on every merge, and main moved every 0-57 minutes throughout the real outage. It
      # would have stayed green for all three days. tests/live-deployment-freshness.test.ts pins
      # that false negative with a case that advances main while holding the deployment fixed.
      # Only the two script steps below need the repository on disk; the probes above are pure
      # curl. Sparse and
      # shallow so the monitor stays cheap enough never to be worth disabling, which is the
      # standing contract in this file's header.
      - name: Check out the monitor scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/check-live-deployment-freshness.mjs
            scripts/check-live-search-results.mjs
          sparse-checkout-cone-mode: false

      - name: Live deployment has not been stranded behind main
        id: deployment_freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Tolerates ordinary deploy lag, which is minutes. Raise via repository variable only
          # with a reason: this number is how long a silent rollback loop may run undetected.
          MAX_LAG_HOURS: ${{ vars.LIVE_DEPLOY_MAX_LAG_HOURS || '12' }}
        run: node scripts/check-live-deployment-freshness.mjs

      # The check the seven-day search outage actually needed, and the one nobody had.
      #
      # Between 2026-09-09 and 2026-09-16, Forms, Medications and Services search returned zero
      # results on the live site for every query, for every user. This workflow stayed green the
      # whole time and every probe above was telling the truth: /forms returned 200, the shell
      # rendered, /api/health said ok. A search returning nothing is an HTTP 200 carrying a
      # well-formed body, so status codes cannot see it. An operator found it, seven days in.
      #
      # The script asserts a degraded domain as hard as an empty one. Since the fix, a broken
      # catalogue serves the in-bundle list instead of nothing, which keeps the reader working and
      # would hide the next occurrence from any monitor that only counts results.
      #
      # It probes only the catalogue domains, never `documents`, so the monitor triggers no
      # embedding call and stays inside this file's no-providers contract.
      #
      # A degraded domain is re-probed once, 12 s later. Since 2026-10-06 a cold read that misses
      # the search budget finishes in the background and heals itself, so one seed answer after
      # idle is by design; a catalogue that is really unreadable is still degraded on the re-probe
      # and still fails. See `degradedReprobeDelayMs` in the script for the bounds.
      - name: Catalogue search returns live results
        id: catalogue_search
        run: node scripts/check-live-search-results.mjs

      # Name the probes that failed, so the routing job below can say what broke rather
      # than only that something did. Reads step outcomes rather than parsing logs.
      - name: Record which probes failed
        id: findings
        if: always()
        env:
          ROOT_SHELL: ${{ steps.root_shell.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          ROUTES: ${{ steps.routes.outcome }}
          WWW_TLS: ${{ steps.www_tls.outcome }}
          DEPLOYMENT_FRESHNESS: ${{ steps.deployment_freshness.outcome }}
          CATALOGUE_SEARCH: ${{ steps.catalogue_search.outcome }}
        run: |
          set -uo pipefail
          {
            echo "findings<<LIVE_MONITOR_FINDINGS_EOF"
            report() {
              if [ "$2" != "success" ] && [ -n "$2" ]; then
                echo "- $1: $2"
              fi
            }
            report "Root renders the app shell" "${ROOT_SHELL:-}"
            report "Health endpoint reports ok in live mode" "${HEALTH:-}"
            report "Key routes stay reachable" "${ROUTES:-}"
            report "WWW and TLS answer" "${WWW_TLS:-}"
            report "Live deployment has not been stranded behind main" "${DEPLOYMENT_FRESHNESS:-}"
            report "Catalogue search returns live results" "${CATALOGUE_SEARCH:-}"
            echo "LIVE_MONITOR_FINDINGS_EOF"
          } >> "$GITHUB_OUTPUT"

  # WHY THIS EXISTS. "A red run is the alert" was true only if a red run reached somebody.
  # Measured 2026-09-18: this monitor failed on every one of its eight consecutive scheduled runs
  # from 2026-09-16T18:34 to 2026-09-18T12:40, correctly reporting that Forms, Services and
  # Medications were answering from the in-bundle catalogue on the live site, and nobody acted for
  # 42 hours. The owner confirmed the failure emails arrive and are not read. Ledger #TN512M: the
  # common defect is delivery, not detection, and adding further checks has negative value until a
  # red check reaches a human. So this adds no probe — only a delivery path the owner named.
  #
  # Split into its own job so `issues: write` is scoped away from the probe job, which keeps
  # `contents: read` and runs curl against a public domain. Same shape as live-drift.yml.
  monitor-routing:
    name: Route monitor status to the pinned issue
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open, update or close the pinned monitor issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROBE_RESULT: ${{ needs.probe.result }}
          PROBE_FINDINGS: ${{ needs.probe.outputs.findings }}
          LIVE_DOMAIN_URL: ${{ vars.LIVE_DOMAIN_URL || 'https://psychiatry.tools' }}
        with:
          script: |
            // Route the alert to a person, not only a label (#TN512M): GitHub notifies an issue's
            // assignee on their phone, for the opening and for every later comment. Best-effort, so
            // a refused assignment can never cost the alert itself.
            const alertAssignee = context.repo.owner;
            async function assignAlert(issueNumber) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [alertAssignee],
                });
              } catch (error) {
                core.warning(`Could not assign @${alertAssignee} to #${issueNumber}: ${error.message}`);
              }
            }

            const title = "Live domain monitor failing";
            const label = "live-monitor-failure";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.PROBE_RESULT || "unknown";
            const findings = (process.env.PROBE_FINDINGS || "").trim();
            const domain = process.env.LIVE_DOMAIN_URL || "the live domain";
            const now = new Date().toISOString();

            // One pinned issue, found by label so a retitle by a human does not orphan it and
            // start a second thread.
            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
            });
            const existing = open.find((issue) => issue.title === title) ?? open[0];

            if (result === "success") {
              if (!existing) {
                core.info("Live domain monitor is green and no failure issue is open.");
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Resolved — the live domain monitor is green again as of ${now}.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${existing.number} after a green monitor run.`);
              return;
            }

            const body = [
              `The live domain monitor is failing against ${domain}. This issue is updated in place`,
              "by `.github/workflows/live-domain-monitor.yml`; it closes automatically on the next",
              "green run, so an open issue means the live site is still degraded right now.",
              "",
              `- Latest failing run: ${runUrl}`,
              `- Job result: \`${result}\``,
              `- Trigger: \`${context.eventName}\``,
              `- Last updated: ${now}`,
              "",
              findings
                ? `### Failing probes\n\n${findings}`
                : "### Failing probes\n\nNone recorded — the job failed before the probes ran, so this is **not** evidence the site is healthy. Read the run log linked above.",
              "",
              "A catalogue-search failure means readers are being served the in-bundle seed catalogue",
              "instead of the published one, so Medications, Forms and Services can be missing anything",
              "published since the last release. Start with the latency of the",
              "`read_site_content_public_records` RPC; context in `src/lib/site-content/catalogue-seed-fallback.ts`.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still failing as of ${now} — ${runUrl}`,
              });
              await assignAlert(existing.number);
              core.warning(`Live domain monitor failing; updated #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [label],
                body,
              });
              await assignAlert(created.data.number);
              core.warning(`Live domain monitor failing; opened #${created.data.number}.`);
            }
