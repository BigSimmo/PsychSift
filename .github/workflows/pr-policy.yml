name: PR Policy

on:
  pull_request_target:
    branches: [main, "release/**"]
    # auto_merge_* re-run the check when auto-merge is armed or disarmed: a migration PR fails
    # while armed (audit CC-01, owner decision 2026-10-20).
    types: [opened, edited, synchronize, reopened, ready_for_review, auto_merge_enabled, auto_merge_disabled]
  merge_group:

# Runs for one PR queue instead of cancelling each other, so a newer synchronize
# cannot leave an older run's evaluation as the last recorded outcome.
concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# contents: read for the trusted checkout and repos.getContent; pull-requests: read
# for PR metadata and the changed-file list. Nothing here writes. The PR head is
# never checked out or executed.
permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target runs trusted workflow-revision code. Checkout
      # github.workflow_sha (not a moving base_ref tip, and not a potentially
      # stale pull_request.base.sha from an older PR) so the policy script is
      # always the exact revision that triggered this run. Never execute the PR
      # head or persist credentials. The merge-queue step below loads the same
      # script from the revision its own workflow file was read from.
      - name: Checkout trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      # PR metadata was validated on the pull_request_target run before the PR entered the
      # queue. Migration ORDER was not: it was checked against main as it stood then, and a
      # queued PR is re-based onto whatever merged ahead of it without ever being re-synced.
      # With a merge queue, "require branches to be up to date" no longer forces that re-sync,
      # so the history gate is re-run here against the queue entry's real base. Everything is
      # read through the API; nothing from the queue head is checked out or executed.
      - name: Recheck migration history against the queue base
        if: github.event_name == 'merge_group'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr-policy.mjs`).href;
            const { migrationHistoryVerdict, migrationVersionsFromEntries, mergeGroupPullRequestNumber } =
              await import(moduleUrl);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const group = context.payload.merge_group;
            if (!group?.base_sha || !group?.head_sha) {
              core.setFailed("Missing merge_group base_sha/head_sha; migration history cannot be verified.");
              return;
            }

            // Top-level supabase/migrations entries at a commit, as name -> blob sha. A directory
            // listing stops at 1000 entries, so a full page fails closed rather than evaluating a subset.
            const listMigrations = async (ref) => {
              const { data } = await github.rest.repos.getContent({ ...repo, path: "supabase/migrations", ref });
              if (!Array.isArray(data)) throw new Error(`supabase/migrations is not a directory at ${ref}`);
              if (data.length >= 1000) throw new Error(`supabase/migrations listing at ${ref} may be truncated`);
              return new Map(data.filter((entry) => entry.type === "file").map((entry) => [entry.name, entry.sha]));
            };
            let base;
            let head;
            try {
              [base, head] = await Promise.all([listMigrations(group.base_sha), listMigrations(group.head_sha)]);
            } catch (error) {
              core.setFailed(
                `Unable to list supabase/migrations for the queue entry: ${error instanceof Error ? error.message : String(error)}. Migration history cannot be verified.`,
              );
              return;
            }
            const baseMigrationVersions = migrationVersionsFromEntries([...base.keys()]);
            if (baseMigrationVersions.length === 0) {
              core.setFailed("The queue base lists no migration versions; migration history cannot be verified.");
              return;
            }

            // What this entry changes in supabase/migrations on top of its base. A rename arrives as
            // a removal plus an addition, which the history gate treats as the stricter of the two.
            const fileStatuses = [];
            for (const [name, sha] of head) {
              if (!base.has(name)) fileStatuses.push({ filename: `supabase/migrations/${name}`, status: "added" });
              else if (base.get(name) !== sha)
                fileStatuses.push({ filename: `supabase/migrations/${name}`, status: "modified" });
            }
            for (const name of base.keys()) {
              if (!head.has(name)) fileStatuses.push({ filename: `supabase/migrations/${name}`, status: "removed" });
            }
            if (fileStatuses.length === 0) {
              core.info("This queue entry changes no migrations.");
              return;
            }

            // The override (approval line plus a validation guard) needs the PR body and the added
            // migrations' SQL. Without a readable PR the body is empty, so any violation fails closed.
            const prNumber = mergeGroupPullRequestNumber(group.head_ref);
            let body = "";
            if (prNumber) {
              try {
                body = (await github.rest.pulls.get({ ...repo, pull_number: prNumber })).data.body || "";
              } catch (error) {
                core.warning(`Unable to read PR #${prNumber}: ${error instanceof Error ? error.message : String(error)}.`);
              }
            }
            const addedMigrationContents = {};
            for (const file of fileStatuses) {
              if (file.status !== "added" || !file.filename.endsWith(".sql")) continue;
              try {
                const { data } = await github.rest.repos.getContent({ ...repo, path: file.filename, ref: group.head_sha });
                if (data && !Array.isArray(data) && typeof data.content === "string") {
                  addedMigrationContents[file.filename] = Buffer.from(data.content, data.encoding || "base64").toString(
                    "utf8",
                  );
                }
              } catch (error) {
                core.warning(`Unable to read ${file.filename} at the queue head: ${error instanceof Error ? error.message : String(error)}.`);
              }
            }

            const verdict = migrationHistoryVerdict({ fileStatuses, baseMigrationVersions, body, addedMigrationContents });
            for (const warning of verdict.warnings) core.warning(warning);
            if (verdict.errors.length > 0) {
              for (const error of verdict.errors) core.error(error);
              core.setFailed(
                `Migration history no longer holds against the queue base (${group.base_sha.slice(0, 12)}): something that merged ahead of this PR changed it. Take the PR out of the queue, bring main in, give the migration the newest timestamp, and queue it again.`,
              );
            }

      - name: Validate pull request evidence
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const { pathToFileURL } = require("node:url");
            const moduleUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr-policy.mjs`).href;
            const {
              evaluatePullRequestPolicy,
              migrationVersionsFromEntries,
            } = await import(moduleUrl);
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const pr = context.payload.pull_request;
            if (!pr?.number) {
              core.setFailed("Missing pull_request.number in pull_request_target payload.");
              return;
            }
            let latestPr;
            try {
              latestPr = (
                await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                })
              ).data;
            } catch (error) {
              core.setFailed(
                `Unable to fetch latest PR metadata for PR #${pr.number}: ${error instanceof Error ? error.message : String(error)}. If this was transient, rerun the job; if it persists, verify this workflow still has pull-request read access.`,
              );
              return;
            }

            if (latestPr.draft) {
              core.notice("Draft PR: metadata policy will be enforced when the PR is marked ready for review.");
              return;
            }

            // Applied migration versions come from the TRUSTED checkout (github.workflow_sha,
            // the base branch), never from the PR head.
            let baseMigrationVersions;
            try {
              baseMigrationVersions = migrationVersionsFromEntries(
                fs.readdirSync(`${process.env.GITHUB_WORKSPACE}/supabase/migrations`),
              );
            } catch (error) {
              core.setFailed(
                `Unable to read supabase/migrations from the trusted checkout: ${error instanceof Error ? error.message : String(error)}. Migration history cannot be verified.`,
              );
              return;
            }
            if (baseMigrationVersions.length === 0) {
              core.setFailed("The trusted checkout lists no migration versions; migration history cannot be verified.");
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              ...repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // listFiles stops at 3000 entries. A truncated list could hide a supabase/ path,
            // so an incomplete file list fails closed rather than evaluating a subset.
            if (typeof latestPr.changed_files === "number" && changedFiles.length < latestPr.changed_files) {
              core.setFailed(
                `GitHub listed ${changedFiles.length} of ${latestPr.changed_files} changed files for PR #${pr.number}; the policy cannot classify an incomplete diff. Split the PR.`,
              );
              return;
            }
            // Migration-history override needs the accompanying fail-fast validation guard's
            // SQL. Read added migration blobs at the PR head via the API (contents: read);
            // never check out or execute the PR head.
            const addedMigrationContents = {};
            for (const file of changedFiles) {
              const status = String(file.status ?? "").toLowerCase();
              if (status !== "added" && status !== "copied") continue;
              if (!/^supabase\/migrations\/\d{14}_[^/]+\.sql$/.test(file.filename)) continue;
              try {
                const { data } = await github.rest.repos.getContent({
                  ...repo,
                  path: file.filename,
                  ref: latestPr.head.sha,
                });
                if (data && !Array.isArray(data) && typeof data.content === "string") {
                  addedMigrationContents[file.filename] = Buffer.from(
                    data.content,
                    data.encoding || "base64",
                  ).toString("utf8");
                }
              } catch (error) {
                core.warning(
                  `Unable to read added migration ${file.filename} at ${latestPr.head.sha}: ${error instanceof Error ? error.message : String(error)}. A migration-history override will fail closed without guard contents.`,
                );
              }
            }

            // Changed workflows and composite actions, read at the PR head through the API (never
            // checked out or executed), so the policy can flag a branch workflow that names or
            // posts a required check. A path whose content cannot be read is left out, and the
            // policy fails closed on it.
            const changedWorkflowContents = {};
            for (const file of changedFiles) {
              if (String(file.status ?? "").toLowerCase() === "removed") continue;
              if (!/^\.github\/(?:workflows\/[^/]+\.ya?ml$|actions\/)/i.test(file.filename)) continue;
              try {
                const { data } = await github.rest.repos.getContent({
                  ...repo,
                  path: file.filename,
                  ref: latestPr.head.sha,
                });
                if (data && !Array.isArray(data) && typeof data.content === "string") {
                  changedWorkflowContents[file.filename] = Buffer.from(
                    data.content,
                    data.encoding || "base64",
                  ).toString("utf8");
                }
              } catch (error) {
                core.warning(
                  `Unable to read changed workflow ${file.filename} at ${latestPr.head.sha}: ${error instanceof Error ? error.message : String(error)}.`,
                );
              }
            }

            // Bot-authored commits: read each bot commit's own files so the policy can block a bot
            // change to Supabase, backend infra SQL or clinical paths. Unreadable data fails closed.
            // AI-agent commits (author, committer or Co-Authored-By) are read too, for a warning.
            const { isBotAuthor, botCoAuthored, aiAgentIdentity } = await import(moduleUrl);
            let commits;
            try {
              const prCommits = await github.paginate(github.rest.pulls.listCommits, {
                ...repo,
                pull_number: pr.number,
                per_page: 100,
              });
              // pulls.listCommits returns at most 250 commits; fail closed rather than skip any.
              if (prCommits.length >= 250 || prCommits.length !== latestPr.commits) {
                core.setFailed(
                  `PR commit list is incomplete (${prCommits.length} of ${latestPr.commits}); bot-authored changes cannot be verified.`,
                );
                return;
              }
              commits = [];
              for (const item of prCommits) {
                const author = {
                  login: item.author?.login ?? "",
                  email: item.commit?.author?.email ?? "",
                  name: item.commit?.author?.name ?? "",
                };
                const committer = { email: item.commit?.committer?.email ?? "", name: item.commit?.committer?.name ?? "" };
                const message = item.commit?.message ?? "";
                const parents = item.parents?.length ?? 1;
                if (!isBotAuthor(author) && !botCoAuthored(message) && !aiAgentIdentity({ author, committer, message })) continue;
                let files;
                try {
                  // getCommit returns at most 300 files per page; paginate (GitHub caps at 3000)
                  // and fail closed if the cap may have been reached.
                  const pages = await github.paginate(
                    github.rest.repos.getCommit,
                    { ...repo, ref: item.sha, per_page: 100 },
                    (response) => response.data.files ?? [],
                  );
                  const commitFiles = pages.flat();
                  if (commitFiles.length >= 3000) throw new Error("file list may be truncated at 3000");
                  files = commitFiles.flatMap((file) =>
                    [file.filename, file.previous_filename].filter(Boolean),
                  );
                } catch (error) {
                  core.warning(`Unable to read files of bot commit ${item.sha}: ${error instanceof Error ? error.message : String(error)}.`);
                }
                commits.push({ sha: item.sha, author, committer, message, parents, files });
              }
            } catch (error) {
              core.setFailed(
                `Unable to list PR commits: ${error instanceof Error ? error.message : String(error)}. Bot-authored changes cannot be verified.`,
              );
              return;
            }

            const result = evaluatePullRequestPolicy({
              commits,
              title: latestPr.title,
              body: latestPr.body || "",
              headRef: latestPr.head.ref,
              files: changedFiles.map((file) => file.filename),
              fileStatuses: changedFiles.map((file) => ({
                filename: file.filename,
                status: file.status,
                previous_filename: file.previous_filename ?? null,
              })),
              baseMigrationVersions,
              addedMigrationContents,
              changedWorkflowContents,
              enforceMigrationHistory: true,
              author: latestPr.user?.login ?? "",
              autoMergeArmed: Boolean(latestPr.auto_merge),
            });

            const warnings = result.warnings || [];
            await core.summary
              .addHeading("PR policy")
              .addRaw(`Clinical risk: ${result.classification.clinicalRisk ? "yes" : "no"}<br>`)
              .addRaw(`Operational risk: ${result.classification.operationalRisk ? "yes" : "no"}<br>`)
              .addRaw(`UI change: ${result.classification.ui ? "yes" : "no"}<br>`)
              .addRaw(`Migration history violations: ${result.migrationHistoryViolations.length}<br>`)
              .addRaw(`Blocking issues: ${result.errors.length}<br>`)
              .addRaw(`Advisory warnings: ${warnings.length}<br>`)
              .write();

            // Advisory metadata nudges (title/summary/verification/UI/risk) are
            // surfaced but never fail the check, and so are the Clinical Governance Preflight and
            // `RAG impact:` declarations (advisory since 2026-09-17). Blocking conditions: a
            // migration PR claiming a deferred deploy or with auto-merge armed; an edit to applied
            // migration history; a bot commit on a protected path; a required-check file changed
            // without a declared reason; and a changed branch workflow that names or posts a
            // required check.
            for (const warning of warnings) core.warning(warning);

            if (!result.ok) {
              for (const error of result.errors) core.error(error);
              core.setFailed(
                `PR policy found ${result.errors.length} blocking issue(s) — see the errors above. Fix the PR body, revert the migration history edit, or fix the flagged workflow, then rerun.`,
              );
            }
