# Ingestion autopilot. Probes the live ingestion queue (reindex-health) and, when
# a stuck-queue signal is present, runs the existing recovery path. Alerts (opens/
# updates an issue) when recoverable work is detected, Supabase is unreachable,
# or an explicitly requested recovery fails.
#
# ENABLED IN DRY-RUN: the 6-hourly schedule is active, but recovery only APPLIES when
# BOTH the dispatch payload `apply=true` AND repo variable INGESTION_AUTOPILOT_APPLY ==
# "true". The variable is intentionally unset, so scheduled runs are read-only probes
# that alert on detected stuck/stranded work, unreachable Supabase, or (with apply)
# failed recovery. To allow real recovery after reviewing a dry-run, set
# INGESTION_AUTOPILOT_APPLY=true and send an `ingestion-autopilot`
# repository dispatch with `client_payload.apply=true`.
name: Ingestion Autopilot

on:
  # repository_dispatch always loads this workflow from the trusted default
  # branch. Do not replace it with workflow_dispatch: manual branch selection
  # would let same-repository writers alter a secret-bearing workflow definition.
  repository_dispatch:
    types: [ingestion-autopilot]
  schedule:
    # Every 6 hours.
    - cron: "0 */6 * * *"

concurrency:
  group: ingestion-autopilot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://sjrfecxgysukkwxsowpy.supabase.co
  SUPABASE_PROJECT_REF: sjrfecxgysukkwxsowpy
  SUPABASE_PROJECT_NAME: PsychSift Production
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-ci-anon-key

jobs:
  ingestion-autopilot:
    # Holds SUPABASE_SERVICE_ROLE_KEY; restricted to main, no required reviewers, so the
    # 6-hourly schedule keeps running unattended. This is NOT an approval gate for --apply.
    # See docs/deployment-architecture.md, "The production-secrets environment" (audit F-21).
    environment: production-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight required secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Ingestion autopilot cannot run — missing secret SUPABASE_SERVICE_ROLE_KEY (production-secrets environment)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Guard Supabase project identity
        run: npm run check:supabase-project

      - name: Run autopilot
        id: autopilot
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Apply only when BOTH the trusted dispatch payload and repo variable allow it.
          APPLY_REQUESTED: ${{ github.event.client_payload.apply || 'false' }}
          APPLY_ALLOWED: ${{ vars.INGESTION_AUTOPILOT_APPLY }}
          # "true" while the worker is deliberately paused, "false" while it should run (audit
          # EVAL-03). A pause is reported as paused, not as an outage; only a pending upload left
          # unclaimed for more than 30 minutes alerts. The ops digest shows the same variable.
          INGESTION_WORKER_PAUSED: ${{ vars.INGESTION_WORKER_PAUSED }}
        run: |
          if [ "$APPLY_REQUESTED" = "true" ] && [ "$APPLY_ALLOWED" = "true" ]; then
            echo "Applying recovery when stuck."
            npm run ingestion:autopilot -- --apply
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "Scheduled dry-run; alert if recoverable work is detected."
            npm run ingestion:autopilot -- --alert-on-stuck
          else
            echo "Dry-run (set repo var INGESTION_AUTOPILOT_APPLY=true and dispatch client_payload.apply=true to recover)."
            npm run ingestion:autopilot
          fi

      - name: Open or update alert issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const label = "ingestion-autopilot";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Ingestion autopilot failed on ${new Date().toISOString()}.`,
              "",
              `Run: ${runUrl}`,
              "",
              "Either recoverable work was detected, a pending upload has waited more than 30 minutes",
              "without being claimed, Supabase was unreachable, or recovery failed. The run log names which.",
              "A pending upload that nothing claims means the worker is stopped, paused or wedged: if the",
              "worker is paused on purpose (repository variable INGESTION_WORKER_PAUSED=true), resume it to",
              "process the upload. Otherwise triage: `npm run reindex:health`, then",
              "`npm run recover:ingestion -- --include-stranded-queued --apply` if a stuck queue or aged",
              "queued-without-job document is confirmed. Do not assume corruption — a transient outage looks the same.",
            ].join("\n");
            // Owner decision 2026-10-21 (docs/decisions/2026-10-21-one-daily-health-summary.md): this
            // workflow no longer @mentions or assigns the owner. Its result reaches the owner's phone once a
            // day in the daily health summary (.github/workflows/daily-health-summary.yml), which reads this
            // issue's label; the issue keeps the detail.

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Ingestion autopilot alert",
                labels: [label],
                body,
              });
            }
