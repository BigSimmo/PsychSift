name: PR batch runner

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Inspect, start, resume, or pause a fixed PR batch"
        type: choice
        options: [dry-run, start, resume, pause, status]
        default: dry-run
      pr_numbers:
        description: "Optional comma-separated open PR numbers; empty snapshots all open main-target PRs"
        type: string
      authorization:
        description: "Codex desktop task reference or cloud task URL (audit reference only)"
        type: string
      confirmation:
        description: "Authorize this batch: repairs, GitHub writes, protected merges and Railway deployments"
        type: string
      per_pr_limit:
        description: "Maximum repair sessions per PR (1-6)"
        type: string
        default: "3"
      batch_limit:
        description: "Maximum repair sessions per batch (1-100)"
        type: string
        default: "30"
      canary_evidence:
        description: 'Optional JSON keyed by PR: {"123":{"head":"SHA","base":"SHA","baseline_run":1,"post_run":2}}'
        type: string
        default: "{}"
  # Only workflows whose completion can change a batch PR's merge readiness wake
  # the controller: they produce the required checks (Gitleaks, PR policy, PR
  # required, PR mergeability). A trusted-target PR-event trigger keyed on the
  # bot actor, plus a wildcard workflow_run, previously produced ~106
  # action_required wake runs for events that could never change readiness.
  workflow_run:
    workflows: ["CI", "PR Policy", "Secret Scan", "PR mergeability"]
    types: [completed]
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

jobs:
  reconcile:
    name: Batch reconcile
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.PR_BATCH_ENABLED == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'PR batch runner')
    # Reads the owner's GH_TOKEN. The environment restricts it to main and has no required
    # reviewers, so the hourly schedule keeps running unattended; it is NOT an approval gate.
    # See docs/deployment-architecture.md, "The production-secrets environment" (audit CC-12).
    environment: production-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pr-batch-mutation
      cancel-in-progress: false
    steps:
      - name: Checkout trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile one bounded batch transition
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_BATCH_STATE_SIGNING_KEY: ${{ secrets.PR_BATCH_STATE_SIGNING_KEY }}
          REPAIR_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { workflowMain } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/pr-batch-runner.mjs`).href);
            await workflowMain({ github, context, core, inputs: context.payload.inputs || {}, repairAvailable: process.env.REPAIR_AVAILABLE === 'true' });
