name: SAST

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
    paths-ignore:
      # Docs-only PRs: Semgrep here is advisory (not in PR required's needs); ci.yml's blocking Ingestion SAST is unaffected.
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Advisory static application security testing. Semgrep is used instead of CodeQL
  # because this repository is private without GitHub Advanced Security, so the
  # code-scanning SARIF upload CodeQL relies on is unavailable. The document parsers
  # (pdfjs-dist, mammoth, exceljs, jszip) and the answer/ingestion
  # paths process untrusted uploaded documents, so ERROR-severity findings remain
  # visible without making mutable registry rules a required merge dependency.
  # Runs OSS-engine only — no Semgrep account or token required.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Same immutable digest as the blocking ingestion gate in ci.yml (the
      # triage-verified 1.168.0 image, docs/maturity-backlog-workorders.md X4):
      # a bare tag can be re-pushed upstream, and this job runs third-party
      # code with read access to the private source tree (audit L36). Bump
      # both references together.
      image: semgrep/semgrep:1.168.0@sha256:59fbed6127ea7c5dde3ba6a85142733bb20ea9aaa36120c953904f1539aaf66e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep scan
        continue-on-error: true
        # --error fails the step on any ERROR-severity finding; --oss-only keeps
        # it token-free; --metrics off sends no telemetry. Named upstream registry
        # rules (p/typescript, p/javascript, p/react, p/nodejs) remain advisory at
        # the workflow boundary (#237JN5) because upstream rule definitions can
        # change independently of this repository, while the blocking Ingestion
        # SAST gate in ci.yml enforces deterministic merge-blocking checks on the
        # untrusted document-upload surface. Secrets are covered by Gitleaks in
        # secret-scan.yml, so no p/secrets here.
        run: >
          semgrep scan
          --error
          --severity ERROR
          --oss-only
          --metrics off
          --config p/typescript
          --config p/javascript
          --config p/react
          --config p/nodejs
          src worker scripts eslint-rules supabase/functions
