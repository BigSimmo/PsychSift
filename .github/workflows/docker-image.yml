name: Docker image build

# Validates that the production app and worker images build cleanly from the
# tree — the deploy contract in docs/deployment-architecture.md ("Images are
# built from main"). Runs the exact `npm ci` + `next build` the Railway deploy
# runs, on a runner with enough memory for the build's 8 GiB heap (local Docker
# Desktop OOMs on this build; GitHub runners and Railway's remote builder have
# enough headroom).
#
# Pull requests and merge queues call this workflow from CI when the repository's
# container scope changes, so the result feeds the required `pr-required`
# aggregate. Standalone runs cover main/release pushes that touch the image
# inputs, a daily schedule, and manual dispatch. Nothing is pushed to a registry:
# Railway builds its own images from the Dockerfiles on deploy (railway.app.json /
# railway.worker.json `builder: DOCKERFILE`), so no deploy consumes this job.
#
# Push paths: `containerPatterns` in scripts/ci-change-scope.mjs (the same scope
# that runs the PR-side container job) plus every file the Dockerfiles COPY by
# name. Before this filter the image rebuilt on every merge, but only 16 of 114
# merges in the week to 6 Oct 2026 touched these paths (~1.4k job-minutes/week).
# tests/container-ci-contract.test.ts fails closed if this list stops covering
# `containerPatterns`. A source-only merge is still built by Railway itself, and
# the daily schedule (was weekly) rebuilds, smokes and Trivy-scans main within a
# day, so a CVE in the base image is still found promptly.

on:
  workflow_call:
  push:
    branches: [main, "release/**"]
    paths:
      - "Dockerfile"
      - "Dockerfile.worker"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
      - ".npmrc"
      - ".nvmrc"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "railway.app.json"
      - "railway.worker.json"
      - "tests/stubs/server-only.ts"
      - "tests/container-ci-contract.test.ts"
      - "tests/deploy-migration-gate.test.ts"
      - "worker/**"
      - "eval/docling/requirements.txt"
      - "eval/docling/verify-model-artifacts.mjs"
      - "eval/docling/model-artifacts.json"
      - "scripts/deploy/**"
      - "scripts/lib/is-entrypoint.mjs"
      - "scripts/app-container-smoke.*"
      - "scripts/build-worker.*"
      - "scripts/check-client-bundle-secrets.*"
      - "scripts/check-image-content-contract.*"
      - "scripts/check-installed-lock-parity.*"
      - "scripts/check-node-engine.*"
      - "scripts/check-upload-limit-parity.*"
      - "scripts/check-worker-python-lock.*"
      - "scripts/enable-server-only-stub.*"
      - "scripts/generate-worker-python-lock.*"
      - "scripts/guard-next-build.*"
      - "scripts/install-git-hooks.*"
      - "scripts/register-server-only.*"
      - "scripts/resolve-oci-image-digest.*"
      - "scripts/resolve-tsx-cli.*"
      - "scripts/run-heavy.*"
      - "scripts/run-tsx.*"
      - "scripts/trivy-image-scan.*"
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  # Use a workflow-specific literal. In a reusable invocation `github.workflow`
  # is the caller's name, which would collide with and cancel the parent CI run.
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build app image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          tags: clinical-kb-app:ci
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://sjrfecxgysukkwxsowpy.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=placeholder-ci-publishable-key
            MAX_UPLOAD_MB=50
            NEXT_PUBLIC_MAX_UPLOAD_MB=50
            ALLOW_LOW_RAM_BUILD=1
          cache-from: type=gha,scope=clinical-kb-app,timeout=2m
          # Only main writes layers. PR builds read main's cache but never export their own:
          # mode=max PR exports were 8.7 GB of the 10 GB Actions cache and evicted npm,
          # Playwright and Next caches within hours. An empty cache-to disables export.
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=gha,scope=clinical-kb-app,mode=max,timeout=2m,ignore-error=true' || '' }}

      - name: Build worker image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.worker
          tags: clinical-kb-worker:ci
          push: false
          load: true
          cache-from: type=gha,scope=clinical-kb-worker,timeout=2m
          # Only main writes layers. PR builds read main's cache but never export their own:
          # mode=max PR exports were 8.7 GB of the 10 GB Actions cache and evicted npm,
          # Playwright and Next caches within hours. An empty cache-to disables export.
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'type=gha,scope=clinical-kb-worker,mode=max,timeout=2m,ignore-error=true' || '' }}

      - name: Verify image content contract
        run: node scripts/check-image-content-contract.mjs

      - name: Run app container smoke (provider-free, cap-drop)
        run: node scripts/app-container-smoke.mjs

      - name: Run worker runtime validation (provider-free, network-isolated)
        run: docker run --rm --network=none --entrypoint node clinical-kb-worker:ci dist/worker/validate-runtime.mjs

      - name: Verify deploy migration gate self-test in both images (provider-free, network-isolated)
        run: |
          docker run --rm --network=none --entrypoint node clinical-kb-app:ci scripts/deploy/await-migrations.mjs --self-test
          docker run --rm --network=none --entrypoint node clinical-kb-worker:ci scripts/deploy/await-migrations.mjs --self-test

      - name: Read-only runtime check (advisory)
        run: |
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_DEMO_MODE=false \
            -e NEXT_PUBLIC_SUPABASE_URL=https://sjrfecxgysukkwxsowpy.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke-test-placeholder \
            -e RAG_QUERY_HASH_SECRET=smoke-test-hash-secret \
            -e RAG_PROVIDER_MODE=offline \
            -e NEXT_TELEMETRY_DISABLED=1 \
            clinical-kb-app:ci \
            node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(j=>{if(j.status!=='ok')throw new Error(JSON.stringify(j));console.log(j)}).catch(e=>{console.error(e);process.exit(1)})" || true
        continue-on-error: true

      - name: Generate SBOMs
        # Advisory: docker-save of both loaded images can ENOSPC on small runners.
        # Free BuildKit cache first; do not fail the required gate on scanner disk pressure.
        continue-on-error: true
        run: |
          docker builder prune -af || true
          df -h || true
          node scripts/trivy-image-scan.mjs clinical-kb-app:ci --sbom sbom-app.cdx.json
          node scripts/trivy-image-scan.mjs clinical-kb-worker:ci --sbom sbom-worker.cdx.json

      - name: Upload SBOMs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sboms
          path: |
            sbom-app.cdx.json
            sbom-worker.cdx.json
          if-no-files-found: warn

      - name: Vulnerability scan (HIGH,CRITICAL)
        # Non-blocking by design — findings are reported, not merge-gating.
        # The summary lines are kept so the next step can surface them.
        continue-on-error: true
        run: |
          docker builder prune -af || true
          : > trivy-scan-summary.txt
          node scripts/trivy-image-scan.mjs clinical-kb-app:ci | tee -a trivy-scan-summary.txt
          node scripts/trivy-image-scan.mjs clinical-kb-worker:ci | tee -a trivy-scan-summary.txt

      - name: Fail on HIGH/CRITICAL image findings outside pull requests
        # Audit M20: the worker image carries the Python parsers (PyMuPDF,
        # Pillow, pytesseract, docling) that read attacker-supplied uploads, and
        # until now a HIGH/CRITICAL finding reached only this run's log. Pull
        # request runs stay advisory (a base-image CVE is not the PR author's
        # change), but the weekly schedule, main pushes and manual dispatches
        # now fail on any HIGH/CRITICAL so the run shows red in the Actions tab.
        # A scanner that could not run (disk pressure, docker save) is still
        # only a warning.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s trivy-scan-summary.txt ]; then
            echo "::warning::Trivy produced no scan summary; image vulnerabilities were not assessed this run."
            exit 0
          fi
          {
            echo "## Trivy image scan (HIGH,CRITICAL)"
            echo
            echo '```'
            cat trivy-scan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          high="$(grep -oE 'HIGH=[0-9]+' trivy-scan-summary.txt | cut -d= -f2 | paste -sd+ - | bc || echo 0)"
          critical="$(grep -oE 'CRITICAL=[0-9]+' trivy-scan-summary.txt | cut -d= -f2 | paste -sd+ - | bc || echo 0)"
          high="${high:-0}"
          critical="${critical:-0}"
          echo "HIGH=${high} CRITICAL=${critical}"
          if [ "${high}" -eq 0 ] && [ "${critical}" -eq 0 ]; then
            exit 0
          fi
          if [ "${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}" = "true" ]; then
            echo "::error::Trivy found HIGH=${high} CRITICAL=${critical} in the production images; see the job summary."
            exit 1
          fi
          echo "::warning::Trivy found HIGH=${high} CRITICAL=${critical} in the production images (advisory on pull requests)."
