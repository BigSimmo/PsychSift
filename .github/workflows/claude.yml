name: Claude

# Runs a Claude Code session when an owner, member or collaborator of this
# repository mentions "@claude" on a pull request comment or review. The
# author_association gate in the job's `if:` is what enforces that boundary;
# the bot check alone would admit any account able to comment (audit L38). Claude reads the triggering comment, works on the
# PR's current head, pushes a scoped fix to the PR branch, and replies in the
# thread. Unlike a subscribed chat session, this fires on the webhook every
# time, so it keeps working after the session that opened the PR has ended.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Least privilege by default; the job widens only what Claude needs.
permissions:
  contents: read

jobs:
  claude:
    name: Respond to @claude
    runs-on: ubuntu-24.04
    # Only run when a human (not a bot) with owner, member or collaborator
    # association mentions @claude on a pull request, so ordinary comments —
    # Claude's own replies, and accounts outside the maintainer's trust
    # boundary — never spin up a runner that holds write and id-token scopes.
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        github.event.review.body != null &&
        contains(github.event.review.body, '@claude'))
    permissions:
      contents: write # push the scoped fix to the PR branch
      pull-requests: write # comment back and update the PR
      issues: write # comment on the PR conversation thread
      id-token: write # OIDC used by the action
      actions: read # read CI results for context
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # Assigned to job env so a step-level `if` can detect an unconfigured
      # secret and skip gracefully instead of hard-failing the check.
      # Authenticates against a Claude subscription (Claude Code usage) rather
      # than pay-per-use API billing. Mint it locally with `claude setup-token`
      # and store it as the CLAUDE_CODE_OAUTH_TOKEN repository secret.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Warn when the OAuth token is not configured
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::warning title=Claude::CLAUDE_CODE_OAUTH_TOKEN secret is not configured; skipping. Generate it with 'claude setup-token' and add it as a repository secret so @claude mentions are handled by your Claude subscription."
      - name: Checkout repository
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run Claude Code
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          # The action's default trigger phrase is "@claude"; it reads the
          # triggering comment/review and acts on the current PR head.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Every @claude run had been failing with a 401
          # ("OAuth access token is invalid") — a stale CLAUDE_CODE_OAUTH_TOKEN
          # secret, root-caused via show_full_output after two earlier fix
          # attempts (#1359, #1366) targeted the wrong thing (project MCP
          # auto-load, which was never the actual cause). No workflow change
          # fixes an invalid token; the secret itself needs regenerating with
          # `claude setup-token`. This disables project MCP auto-load anyway,
          # since a CI runner has no legitimate use for it (e.g. this repo's
          # .mcp.json "railway" server, which has no session/auth in Actions).
          settings: '{"enableAllProjectMcpServers": false}'
