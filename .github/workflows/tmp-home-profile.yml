# TEMPORARY: draft-PR-only profiling of desktop "/" hydration. Removed before the PR is marked ready.
name: TEMP home profile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  profile:
    if: github.head_ref == 'grok/home-tbt-trim'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-node-cached
      - name: Setup pinned Chromium
        uses: ./.github/actions/setup-lighthouse-chromium
      - name: Measure with trace + source maps
        env:
          TEMP_PROFILE_SOURCEMAPS: "1"
          LIGHTHOUSE_PROFILE_DIR: profile
        run: npm run verify:lighthouse -- --keep --dir lighthouse || true
      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-profile-${{ github.run_id }}
          path: |
            profile/
            lighthouse/
          if-no-files-found: warn
