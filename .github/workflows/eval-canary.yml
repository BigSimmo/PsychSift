# Weekly production eval canary. See docs/observability-slos.md §3.
#
# Runs the golden retrieval eval (which PR CI can never run — it needs live
# Supabase + OpenAI keys) plus a small answer-quality subset against the live
# project, and fails loudly on regression: red run + a GitHub issue on
# scheduled failures. Each run also uploads the eval JSON artifact that feeds
# offline ranking-snapshot regeneration (scripts/build-ranking-snapshot.ts).
#
# The schedule and repository dispatch both load this workflow from the default
# branch. After merging, send an `eval-canary` repository dispatch and confirm
# it is green before trusting the weekly cadence.
name: Eval Canary

on:
  # repository_dispatch always loads this secret-bearing workflow and its code
  # from the trusted default branch. Optional client_payload keys are
  # answer_case_limit, rag_ranking_config, and answer_quality_eval.
  repository_dispatch:
    types: [eval-canary]
  schedule:
    # Sunday 18:00 UTC = Monday 02:00 Australia/Perth — off-peak for clinicians.
    - cron: "0 18 * * 0"

concurrency:
  group: eval-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://sjrfecxgysukkwxsowpy.supabase.co
  SUPABASE_PROJECT_REF: sjrfecxgysukkwxsowpy
  SUPABASE_PROJECT_NAME: PsychSift Production
  # Evals use the service-role admin client; the publishable key only needs to
  # satisfy env validation (same placeholder approach as ci.yml).
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-ci-anon-key
  # Empty for schedule runs and default dispatches (resolveRankingConfig treats empty as
  # unset); non-empty only for staged ranking-weight evals via the dispatch input.
  RAG_RANKING_CONFIG: ${{ github.event.client_payload.rag_ranking_config || '' }}
  # Pace golden retrieval so forced-vector probes do not trip transient 429s
  # after a long text-fast-path run (see vector-ptsd history in eval-canary).
  RAG_EVAL_CASE_DELAY_MS: 2000
  RAG_EVAL_FORCE_EMBEDDING_DELAY_MS: 5000
  RAG_EVAL_PROVIDER_RETRY_ATTEMPTS: 6
  RAG_EVAL_PROVIDER_RETRY_INITIAL_MS: 8000
  RAG_EVAL_PROVIDER_RETRY_MAX_MS: 120000
  # Cost self-reporting (estimated_cost_usd in eval summaries; was "n/a" with these unset).
  # Rates = gpt-5.6-terra standard tier per 1M tokens (verified from the OpenAI pricing page
  # 2026-07-21). The strong model (gpt-5.6-sol) costs 2x these rates and the estimator
  # applies ONE rate set to all usage, so estimated_cost_usd is a LOWER BOUND on runs where
  # strong retries fire. Public list prices, not secrets.
  RAG_EVAL_INPUT_USD_PER_MILLION: "2.50"
  RAG_EVAL_CACHED_INPUT_USD_PER_MILLION: "0.25"
  RAG_EVAL_OUTPUT_USD_PER_MILLION: "15.00"
  # The live corpus is all-public (owner_id = NULL). Owner-scoped retrieval
  # fail-closes on a null owner, so the eval must run as the public-owner
  # sentinel. resolveEvalOwnerId (scripts/eval-utils.ts) defaults to that
  # sentinel when no owner is set, so deliberately do NOT pin an eval owner
  # here — pinning the E2E user (who owns 0 public docs) returns 0 candidates
  # and fails the golden threshold. Set RAG_EVAL_OWNER_ID only if the corpus
  # is ever re-scoped to a real owner.

jobs:
  eval-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record evaluated Git SHA
        shell: bash
        run: echo "EVAL_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Fail loudly on a malformed override: resolveRankingConfig (src/lib/ranking-config.ts)
      # silently falls back to production defaults on bad JSON, which would turn a staged-weights
      # eval into an accidental baseline and corrupt the pair comparison.
      - name: Validate ranking-config override
        id: validate_override
        if: github.event.client_payload.rag_ranking_config != ''
        run: |
          node -e '
            const raw = process.env.RAG_RANKING_CONFIG;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
              throw new Error("rag_ranking_config must be a JSON object");
            }
            console.log("RAG_RANKING_CONFIG override active:", JSON.stringify(parsed));
          '

      - name: Preflight required secrets
        id: preflight
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$OPENAI_API_KEY" ] && missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Eval canary cannot run — missing repo secrets:$missing"
            exit 1
          fi

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        id: install
        run: npm ci --include=dev

      - name: Guard Supabase project identity
        id: project_guard
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:supabase-project

      - name: Golden retrieval eval (live corpus)
        id: golden_retrieval
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .local/eval-canary
          set -o pipefail
          # --json-out writes the per-case artifact (input for scripts/build-ranking-snapshot.ts)
          # without changing stdout — the tee'd log keeps the human-readable per-case lines the
          # failure-issue analyzer parses.
          npm run eval:retrieval:quality -- --fail-on-threshold --json-out .local/eval-canary/golden-retrieval.json 2>&1 | tee .local/eval-canary/golden-retrieval.log

      - name: Answer-quality subset (live generation)
        id: answer_quality
        env:
          ANSWER_CASE_LIMIT: ${{ github.event.client_payload.answer_case_limit || '44' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Canary-only latency allowance: cross-region runner -> Sydney Supabase
          # + OpenAI. Release/local eval:quality keeps the strict default gates.
          EVAL_LATENCY_CONTEXT: cross-region-runner
        run: |
          if [[ ! "$ANSWER_CASE_LIMIT" =~ ^[0-9]+$ ]] || (( ANSWER_CASE_LIMIT < 1 || ANSWER_CASE_LIMIT > 100 )); then
            echo "answer_case_limit must be an integer from 1 to 100" >&2
            exit 2
          fi
          mkdir -p .local/eval-canary
          set -o pipefail
          npm run eval:quality -- --rag-only --limit "$ANSWER_CASE_LIMIT" --source-governance-results .local/eval-canary/golden-retrieval.json --output-dir .local/eval-canary/quality-reports --fail-on-threshold 2>&1 | tee .local/eval-canary/answer-quality.log

      # Phase E baseline/paired-run instrument: the five answer-quality metrics (relevance,
      # readability, artifact leaks, intent coverage, fail-closed) + per-intent structural
      # targeting over the 30-case fixture. Informational by design — no --targeting-floor,
      # exit 0 — so quality gates stay owned by the eval:quality step above; the tee'd log
      # rides the existing artifact upload. `!cancelled()` keeps the instrument running when
      # the gate subset above fails: a baseline/paired run must observe red gates too
      # (proven necessary on dispatch #57, where a red eval:quality skipped this step).
      - name: Answer-quality targeting eval (optional, dispatch-only)
        id: answer_targeting
        if: ${{ !cancelled() && github.event_name == 'repository_dispatch' && github.event.client_payload.answer_quality_eval == 'true' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p .local/eval-canary
          set -o pipefail
          # --dump-answers captures per-case answer TEXTS (not retained anywhere at rest) so
          # targeting misses are diagnosable offline; rides the existing artifact upload.
          # Content sensitivity matches the tee'd log: all-public corpus, no env values.
          npm run eval:answer-quality -- --dump-answers .local/eval-canary/answer-targeting-answers.json 2>&1 | tee .local/eval-canary/answer-targeting.log

      # Every individually failing case, on every run (audit F24). The thresholds decide red or
      # green; an aggregate green run can still carry a failing case (#628), so the job summary
      # lists them all and a green run with failures gets a warning annotation.
      - name: Per-case summary
        if: always() && steps.install.outcome == 'success'
        run: node scripts/eval-canary-case-summary.mjs --reports-dir .local/eval-canary/quality-reports

      # Uploaded on success AND failure: the JSON artifact regenerates the offline ranking
      # snapshot (download it, then `npm run build:ranking-snapshot -- --input <json> --output
      # scripts/fixtures/rag-ranking-candidate-snapshot.v1.json --source-run-id <run-id>`), and
      # the logs carry failure diagnostics. Contents match what the tee'd step logs already
      # expose (titles/file names, score telemetry, 220-char previews of the all-public corpus)
      # — no env values or secrets are written to .local/eval-canary.
      - name: Upload eval output artifact
        if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-canary-output
          path: .local/eval-canary/
          # .local/ is a hidden directory (the repo's gitignored scratch convention), which
          # upload-artifact excludes by default.
          include-hidden-files: true
          # Matches the snapshot freshness window enforced by tests/ranking-tuning.test.ts.
          retention-days: 30
          if-no-files-found: ignore

      # Dispatch failures matter as much as scheduled ones — a red dispatch is usually one
      # half of a canary pair gating a behaviour change, so it must not fail silently.
      #
      # TWO OUTCOMES, NOT ONE (ledger #SXPQ0A). `failure()` has always covered a run that
      # COMPLETED and then missed a blocking threshold — `eval:quality --fail-on-threshold` sets
      # exit code 1 (scripts/eval-quality.ts), `run-eval-safe.mjs` propagates it, and the step runs
      # under `set -o pipefail`, so the job goes red and this step fires. What was missing is that
      # the issue then said "evaluation did not complete" about an evaluation that completed
      # perfectly and reported a real quality verdict. Measured: the answer-quality subset has
      # failed the same three cases (clozapine-monitoring, clozapine-monitoring-paraphrase,
      # nocc-requirements) on every run since 2026-08-23 while golden retrieval passed throughout,
      # and #SXPQ0A records that as "nothing tracks it" — because the one rolling thread was
      # titled as an infrastructure outage and read as one.
      #
      # So the title is now derived from the failure class the analyzer already computes, and the
      # two classes get separate threads. The word "regression" is deliberately still absent from
      # every title: PR #629 removed it precisely because provider/quota failures were being filed
      # as retrieval regressions, and `tests/eval-canary-workflow.test.ts` pins that.
      - name: Open or update canary failure issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            // If checkout failed, the analyzer module is absent; the issue must still open,
            // so fall back to a fixed diagnosis instead of letting the import throw.
            let analyzeFailureText = () => ({
              category: "unclassified",
              confidence: "none",
              reason: "failure analyzer unavailable (checkout likely failed before scripts/ existed); inspect step outcomes",
            });
            try {
              ({ analyzeFailureText } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/productivity-core.mjs`).href));
            } catch (error) {
              core.warning(`analyzeFailureText unavailable, using fallback diagnosis: ${error.message}`);
            }
            const label = "eval-canary";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const logPaths = [
              ".local/eval-canary/golden-retrieval.log",
              ".local/eval-canary/answer-quality.log",
              ".local/eval-canary/answer-targeting.log",
            ].map((item) => path.join(process.env.GITHUB_WORKSPACE, item));
            const failureText = logPaths
              .filter((item) => fs.existsSync(item))
              .map((item) => fs.readFileSync(item, "utf8"))
              .join("\n");
            const diagnosis = analyzeFailureText(failureText);
            const stepOutcomes = {
              checkout: "${{ steps.checkout.outcome }}",
              preflight: "${{ steps.preflight.outcome }}",
              setup_node: "${{ steps.setup_node.outcome }}",
              install: "${{ steps.install.outcome }}",
              validate_override: "${{ steps.validate_override.outcome }}",
              project_guard: "${{ steps.project_guard.outcome }}",
              golden_retrieval: "${{ steps.golden_retrieval.outcome }}",
              answer_quality: "${{ steps.answer_quality.outcome }}",
              answer_targeting: "${{ steps.answer_targeting.outcome }}",
            };
            const trigger = context.eventName === "schedule" ? "Weekly (scheduled)" : "Dispatched";

            // A run that reached a verdict and failed it is a different event from a run that
            // never got there, and it needs a different thread, a different title and a different
            // first move. `probable-regression` is the analyzer's name for "a completed evaluation
            // reported failing cases or blocking threshold failures" — it is only reached after
            // the environment and provider/quota/auth branches have been ruled out, which is what
            // makes it safe to assert completion in the title.
            const completed = diagnosis.category === "probable-regression";
            const title = completed
              ? "Eval canary failure: a completed evaluation missed its blocking threshold"
              : "Eval canary failure: evaluation did not complete";

            // Name the half that failed. Golden retrieval and the answer-quality subset have
            // different owners and different stop rules, and #SXPQ0A exists because a red canary
            // that never said which one was failing read as "retrieval has regressed" when
            // retrieval was passing every case throughout.
            const half =
              stepOutcomes.golden_retrieval === "failure"
                ? "golden retrieval (live corpus)"
                : stepOutcomes.answer_quality === "failure"
                  ? "the answer-quality subset (live generation)"
                  : "a step before either evaluation ran";

            // The blocking-failure list from the answer-quality report, verbatim. Without it the
            // issue records that a threshold failed but not which cases, which is the difference
            // between a tracked defect and a recurring alarm.
            const blocking = failureText
              .match(/\nBlocking failures:\s*\n([\s\S]*?)(?=\nAccepted metadata-debt failures:|\nAll threshold failures:|$)/)?.[1]
              ?.trim();

            const body = [
              `${trigger} eval canary failed on ${new Date().toISOString()}.`,
              "",
              `Run: ${runUrl}`,
              "",
              `Failure class: ${diagnosis.category} (${diagnosis.confidence})`,
              `Reason: ${diagnosis.reason}`,
              `Failing half: ${half}`,
              `Step outcomes: ${JSON.stringify(stepOutcomes)}`,
              "",
              completed
                ? [
                    "**The evaluation completed.** This is a quality verdict, not an outage: the run",
                    "reached a threshold and missed it. Do not rerun hoping for green, and do not treat",
                    "provider health as the first suspect.",
                    "",
                    blocking ? `### Blocking threshold failures\n\n\`\`\`\n${blocking}\n\`\`\`` : "",
                    blocking
                      ? ""
                      : "The blocking-failure list could not be read from the eval logs, so this issue records that a threshold failed but not which cases. Read the `eval-canary-output` artifact on the run above.",
                    "STOP — do not relax the threshold, add `acceptSourceOnly` to the failing cases, or",
                    "edit the golden fixture to get this green. Retrieval and ranking are a protected",
                    "surface: any change there needs a paid live canary pair and explicit owner approval",
                    "(AGENTS.md \u201cRAG ranking protection\u201d). The half that is still passing remains a valid",
                    "baseline in the meantime.",
                  ].join("\n")
                : [
                    "Triage order (docs/observability-slos.md §3): inspect the failed step first.",
                    "Resolve provider quota/auth/config failures before rerunning; for completed evals,",
                    "check hybrid_rpc_errors and `npm run check:indexing`, then investigate corpus or code drift.",
                    "Do not bisect or revert code until provider health and the failure class are confirmed.",
                  ].join("\n"),
            ].join("\n");

            // Route the alert to a person, not only a label (#TN512M): GitHub notifies an issue's
            // assignee on their phone, for the opening and for every later comment. Best-effort, so
            // a refused assignment can never cost the alert itself.
            const alertAssignee = context.repo.owner;
            async function assignAlert(issueNumber) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [alertAssignee],
                });
              } catch (error) {
                core.warning(`Could not assign @${alertAssignee} to #${issueNumber}: ${error.message}`);
              }
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            // Matched by title, not `existing[0]`. The two classes are separate threads on purpose:
            // appending a completed-evaluation verdict to a thread titled "did not complete" is how
            // three answer-quality cases stayed untracked for three weeks.
            const thread = existing.find((issue) => issue.title === title);
            if (thread) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: thread.number,
                body,
              });
              await assignAlert(thread.number);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body,
              });
              await assignAlert(created.data.number);
            }
