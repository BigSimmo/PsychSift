name: Document drafts
on:
  pull_request:
    paths:
      - scripts/document-drafts.py
      - scripts/test-document-drafts.py
      - docs/agents/document-drafts.md
      - .github/workflows/document-drafts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check copy, merge, conflict, hash and path safety
        run: python3 scripts/test-document-drafts.py
