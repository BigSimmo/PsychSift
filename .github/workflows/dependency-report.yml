# Fortnightly dependency report. Surfaces outdated direct dependencies and audit
# vulnerabilities into a rolling issue. REPORT ONLY — it never updates deps; acting
# on the report means running the AGENTS.md `dependency` protocol by hand.
#
# Report-only: never updates deps. Fortnightly cadence enabled (07:00 UTC on the
# 1st and 15th) plus manual dispatch. Acting on the report means running the
# AGENTS.md `dependency` protocol by hand.
name: Dependency Report

on:
  workflow_dispatch: {}
  schedule:
    # 07:00 UTC on the 1st and 15th.
    - cron: "0 7 1,15 * *"

concurrency:
  group: dependency-report
  cancel-in-progress: false

permissions:
  contents: read

# Two jobs, the same shape as organisation-weekly.yml: the job that runs `npm ci` (every
# dependency's install scripts) and repository code keeps `contents: read` only, and
# `issues: write` sits on a job that checks out and runs nothing from the repository. The
# report crosses between them as an artifact, and its step outputs as job outputs.
jobs:
  dependency-report:
    # main only: a manual run from another branch would publish that branch's report as main's.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      outdated: ${{ steps.report.outputs.outdated }}
      severity: ${{ steps.report.outputs.severity }}
      evidence_complete: ${{ steps.report.outputs.evidence_complete }}
      outdated_state: ${{ steps.report.outputs.outdated_state }}
      audit_state: ${{ steps.report.outputs.audit_state }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Render dependency report
        id: report
        run: node scripts/dependency-report.mjs --out dependency-report.md

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report
          path: dependency-report.md
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish the dependency report
    needs: dependency-report
    # Implicit success(): as before, a failed install or render publishes nothing. The render
    # step always exits 0, so an incomplete measurement still reaches the issue and the gate below.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-report
          path: dependency-report

      - name: Publish to rolling issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Pass job outputs via env (not inline template expansion) to avoid the
          # GitHub Actions template-injection pattern, even though both values are
          # currently a fixed enum / plain integer produced by our own script.
          OUTDATED_COUNT: ${{ needs.dependency-report.outputs.outdated }}
          SEVERITY: ${{ needs.dependency-report.outputs.severity }}
          EVIDENCE_COMPLETE: ${{ needs.dependency-report.outputs.evidence_complete }}
          OUTDATED_STATE: ${{ needs.dependency-report.outputs.outdated_state }}
          AUDIT_STATE: ${{ needs.dependency-report.outputs.audit_state }}
        with:
          script: |
            const fs = require("fs");
            const label = "dependency-report";
            const body = fs.readFileSync("dependency-report/dependency-report.md", "utf8");
            // `outdated` is the string "unknown" when the check never produced a
            // result, so it is deliberately NOT coerced with Number(): that would
            // turn a failed measurement back into 0, which is exactly the erasure
            // this workflow's evidence gate exists to stop.
            const outdated = process.env.OUTDATED_COUNT || "unknown";
            const severity = process.env.SEVERITY || "unknown";
            const evidenceComplete = process.env.EVIDENCE_COMPLETE === "true";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });
            let issueNumber;
            if (existing.length > 0) {
              issueNumber = existing[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Dependency report",
                labels: [label],
                body,
              });
              issueNumber = created.data.number;
            }
            // Notify on high/critical vulns, AND on a missing measurement. An
            // unmeasured fortnight is not a quiet one: severity "unknown" means
            // nobody looked, and staying silent about that is how a broken report
            // reads as a clean bill of health for weeks.
            if (severity === "high" || severity === "critical") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `⚠ ${severity} vulnerability present (${outdated} outdated direct deps) — ${new Date().toISOString()}`,
              });
              core.warning(`Dependency audit highest severity: ${severity}`);
            } else if (!evidenceComplete) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body:
                  `⚠ Dependency evidence incomplete — outdated: \`${process.env.OUTDATED_STATE}\`, ` +
                  `audit: \`${process.env.AUDIT_STATE}\` — ${new Date().toISOString()}. ` +
                  "The report above records what was and was not measured. Absent counts are unknown, not zero.",
              });
              core.warning("Dependency report published with an incomplete measurement.");
            }

      # The report is published FIRST and the run fails AFTER, deliberately. The
      # incomplete digest is the evidence of what went wrong, so it must reach the
      # rolling issue even when the run goes red; failing before publishing would
      # leave the previous fortnight's numbers standing as the newest thing anyone
      # sees. Ordinary vulnerability findings do NOT fail this job — they are data
      # for the existing security gates. Only missing evidence does.
      - name: Require a complete measurement
        if: ${{ needs.dependency-report.outputs.evidence_complete != 'true' }}
        env:
          OUTDATED_STATE: ${{ needs.dependency-report.outputs.outdated_state }}
          AUDIT_STATE: ${{ needs.dependency-report.outputs.audit_state }}
        run: |
          echo "::error::Dependency report could not measure its inputs (outdated=$OUTDATED_STATE, audit=$AUDIT_STATE)."
          echo "The published report says so explicitly. Absent counts are unknown, not zero."
          exit 1
