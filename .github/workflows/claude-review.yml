name: Claude review

# Automatic, advisory code review on pull requests.
#
# Why this exists. Until 2026-09-19 this repository had three automated
# reviewers and, on that day, none of them ran on any PR:
#   - CodeRabbit  — categorical eligibility gate, "fewer than 10 stars" (the
#                   repo has 0). Not a budget symptom; a cap raise cannot fix it.
#   - ChatGPT Codex connector — "reached your Codex usage limits for code reviews".
#   - Cursor Bugbot           — "usage limit reached".
# The owner decision of 2026-08-22 (`#CCZ4HB`, AGENTS.md "Automated review
# coverage") accepted intermittent bot review on the explicit condition that it
# be re-opened "if the Codex connector also stops reviewing". It has. This job
# is the re-opened answer: coverage that depends on a subscription the repo
# already holds rather than on a per-review spend cap.
#
# Deliberately NOT a gate. Branch protection requires only the `pr-required`
# aggregate in ci.yml, and this workflow is absent from its `needs:`, so it can
# never block a merge. That is the standing rule in AGENTS.md — never weaken a
# required check to compensate for review coverage — read the other way round:
# adding review must not add a gate either. The same holds under the merge
# queue: this workflow has no `merge_group` trigger, and the queue waits only
# for required checks, so it can never hold up a queue entry.
#
# Not a gate was not the same as not a red X, and for three days it was not.
# This comment used to claim `continue-on-error` kept a credential problem from
# "painting a red X that trains readers to ignore red". It did not, and the
# claim is the reason nobody checked: at JOB level `continue-on-error` only
# stops the failed job failing the WORKFLOW RUN. The job's own check run still
# reports `failure`, and that is what a reader sees on the PR. Measured
# 2026-09-22 on #2976, #2977, #2978 and #2979 — four unrelated diffs, four red
# `Claude review` crosses, on a workflow that already carried the job-level
# flag. Recorded as `#NNAWDT`.
#
# So the flag is on the review STEP now, where it does what the paragraph above
# always claimed. A step that cannot run leaves the job green and posts a
# warning annotation instead, which is the honest shape for an advisory check:
# visible to anyone who looks, invisible to the merge button. The alternative —
# leaving a permanent red X on every PR — is worse than no reviewer, because it
# is exactly how a real red check comes to be ignored.
#
# Drafts are skipped, matching every heavy job in ci.yml. A draft cannot be
# merged, undrafting fires `ready_for_review` which re-runs this, and a review
# of a work-in-progress diff spends subscription quota on findings its author
# already intends to change.

on:
  pull_request:
    # One automatic pass per undraft/open. `synchronize` is deliberately absent:
    # AGENTS.md one-pass review throttling forbids burning subscription quota on
    # every repair push, format commit, or base sync. Re-review: mark ready again
    # after a draft cycle, or invoke the @claude comment workflow.
    types: [opened, ready_for_review]

# Least privilege by default; the job widens only what the review needs.
permissions:
  contents: read

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read # read the diff; this job never pushes
      pull-requests: write # post the review comment
      id-token: write # OIDC used by the action
    concurrency:
      # If a ready_for_review re-run overlaps an in-flight review, cancel the
      # stale one — it describes a draft head that is no longer current.
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 20
    env:
      # Assigned to job env so a step-level `if` can detect an unconfigured
      # secret and skip gracefully instead of hard-failing. Authenticates
      # against a Claude subscription rather than pay-per-use API billing, which
      # is the whole point — no per-review spend cap to exhaust. Mint it with
      # `claude setup-token` and store it as the CLAUDE_CODE_OAUTH_TOKEN secret.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Warn when the OAuth token is not configured
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::warning title=Claude review::CLAUDE_CODE_OAUTH_TOKEN secret is not configured; skipping. Generate it with 'claude setup-token' and add it as a repository secret. Until then this PR has no automated review at all — CodeRabbit, Codex and Bugbot were each unavailable when this workflow was added."

      - name: Checkout repository
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review the pull request
        id: review
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        # Advisory: a failure here is never this PR's problem to fix, so it must
        # not reach the PR as a red check. At STEP level this is what keeps the
        # job green; at job level it did not. See the header.
        continue-on-error: true
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `track_progress` is the action's documented mode for pull_request
          # events (opened/ready_for_review); without it the action
          # expects a trigger phrase in a comment, which no PR event carries.
          track_progress: true
          # One comment that updates in place. Without this, every push to a
          # long-lived PR leaves another full review on the thread.
          use_sticky_comment: true
          # A CI runner has no session for this repo's .mcp.json servers (the
          # `railway` entry has no auth in Actions), so auto-load stays off —
          # aligned with .claude/settings.json ("enableAllProjectMcpServers": false)
          # and the @claude workflow beside this one.
          settings: '{"enableAllProjectMcpServers": false}'
          prompt: |
            Review this pull request's diff. You are the only automated reviewer
            on it, so be useful rather than exhaustive: a reviewer who lists
            everything is read as noise and ignored.

            This is PsychSift, a clinical guideline knowledge base used by a
            psychiatrist. Read AGENTS.md before reviewing — it is the repository's
            own rule set and it outranks your general habits. Weight findings by
            what this repository can actually lose:

            1. Clinical correctness and governance. A wrong dose, threshold,
               interval or safety label is the worst outcome here. So is an
               answer that cites a source which does not support it. Failure
               must degrade conservatively rather than guess.
            2. Anything touching `supabase/migrations/**`. Merging one reaches
               the live clinical database within seconds, with no deploy step in
               between and no undo.
            3. Retrieval and ranking surfaces (`src/lib/rag/**`, the text and
               structured-evidence producers named in AGENTS.md "RAG ranking
               protection"). Ordering changes here are live-validated and are
               easy to make by accident during a refactor.
            4. Privacy and owner scoping: any path where one owner's documents
               could reach another's results.
            5. Tests that were weakened rather than fixed — a skip, a
               quarantine, a loosened assertion, a deleted case.

            Report what you can point at in the diff. For each finding give the
            file and line, what breaks, and the input or state that breaks it.
            If you are inferring rather than reading, say so in that finding.
            Do not restate what the PR description already says, do not praise,
            and do not raise style where the repository's own linters are
            silent. If the diff is sound, say that in one line and stop.

      - name: Report a review that could not run
        # The other half of the step flag, and the part that stops "advisory"
        # becoming "silent". A reviewer that quietly stops reviewing is how this
        # repository went from three automated reviewers to none without anyone
        # noticing for weeks. A warning annotation is visible on the run and in
        # the PR's checks panel, and blocks nothing.
        #
        # Use a block scalar. An inline `run: echo "... #NNAWDT."` is truncated by
        # YAML at `#` (comment start), leaving an unclosed quote that fails the
        # step with `unexpected EOF while looking for matching '"'` and paints
        # the red X this workflow was meant to stop — measured 2026-09-22 on
        # #2982 and codex/pr-ci-adaptive-audit after #2981 landed.
        #
        # It also names WHY. The action hides Claude's own output ("full output
        # hidden for security"), and every failure since 2026-09-20 has looked
        # identical: one call, no cost, `is_error: true`, no reason — so the
        # leading theory (a lapsed login token) has never been confirmed. The
        # action's own remedy, `show_full_output: true`, prints the whole
        # transcript to a public log and stays off. Instead this reads ONE
        # thing from the saved transcript — the final error sentence — strips
        # anything long enough to be a credential, caps it at 300 characters
        # and prints only that. GitHub also masks the secret's value in any
        # log line. That sentence is what turns "it failed" into "renew the
        # token" or "that model isn't on this plan".
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' && steps.review.outcome == 'failure' }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          reason=""
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            reason=$(jq -r '
              [ (if type == "array" then .[] else . end)
                | select(type == "object")
                | if .type == "result" then (.result // empty)
                  elif .type == "assistant" then (.message.content[]? | select(.type == "text") | .text)
                  else empty end ]
              | map(select(type == "string" and length > 0)) | last // ""' "$EXECUTION_FILE" 2>/dev/null || true)
          fi
          reason=$(printf '%s' "$reason" | tr '\r\n' '  ' | sed -E 's/[A-Za-z0-9_.+/=-]{24,}/[redacted]/g; s/%/%25/g' | cut -c1-300)
          lowered=$(printf '%s' "$reason" | tr '[:upper:]' '[:lower:]')
          case "$lowered" in
            *expired*|*invalid*|*401*|*403*|*authenticat*|*unauthori*|*/login*|*oauth*)
              hint="Most likely the login token has lapsed: on a computer signed in to the Claude subscription, run 'claude setup-token' and paste the new token into the CLAUDE_CODE_OAUTH_TOKEN repository secret." ;;
            *model*|*404*|*"not found"*)
              hint="The model this run asked for is not available to the account behind the token." ;;
            *limit*|*429*|*quota*|*"rate "*|*overloaded*|*529*)
              hint="A usage or capacity limit was hit; it clears on its own, and the next opened or undrafted PR will be reviewed." ;;
            "")
              hint="No reason was recorded in the transcript." ;;
            *)
              hint="The reason above is not one this step recognises." ;;
          esac
          echo "::warning title=Claude review::The automated review did not run on this PR, so this PR has no Claude review. Advisory only; it does not block the merge. Reason reported: ${reason:-none}. ${hint} Tracked as #NNAWDT."
