name: Staging tenancy isolation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
  # THE STAGING GATE (owner decision 2026-10-21, docs/decisions/2026-10-21-staging-gate-before-live.md).
  # Every main push that changes an app input waits for staging to run it, then proves two-user
  # separation there. Railway "Wait for CI" is ON for the live services (found 2026-10-21), so a
  # failed run here SKIPS that live deploy. That is the point, but only once staging itself is
  # healthy: the job is OFF until the repository variable STAGING_GATE_ENFORCE is "true". Until
  # then a push starts nothing, so it can neither delay nor block a deploy. Keep Railway "Wait for CI"
  # OFF on the staging service: staging would wait for this run while this run waits for staging.
  # These paths mirror railway.app.json watchPatterns (pinned by tests/staging-tenancy-workflow.test.ts):
  # a push outside them does not redeploy the app, so there is nothing new to prove.
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "railway.app.json"
      - "data/**"
      - "!data/repo-awareness-snapshot.json"
      - "!data/outstanding-issues-snapshot.json"
      - "public/**"
      - "src/**"
      - "scripts/check-client-bundle-secrets.mjs"
      - "scripts/check-installed-lock-parity.mjs"
      - "scripts/check-node-engine.cjs"
      - "scripts/check-upload-limit-parity.mjs"
      - "scripts/guard-next-build.mjs"
      - "scripts/install-git-hooks.mjs"
      - "scripts/run-heavy.mjs"
      - "scripts/stamp-service-worker.mjs"
      - "scripts/deploy/**"

concurrency:
  group: staging-tenancy-isolation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross-tenant:
    name: Cross-tenant staging harness
    # The push gate runs only when switched on (see the trigger comment above).
    if: ${{ github.event_name != 'push' || vars.STAGING_GATE_ENFORCE == 'true' }}
    runs-on: ubuntu-24.04
    # Job ceiling stays above the resolver's longest wait (30 minutes on a push) plus the scheduled
    # step's 15-minute `timeout`, so a hung harness exits as a failed step (absorbable by
    # continue-on-error) instead of GitHub killing the whole job — which continue-on-error cannot
    # soften and which would still fail the run.
    timeout-minutes: 60
    # The routing job reads the harness step's own outcome, because a continue-on-error step
    # leaves the job reporting `success` through `needs`.
    outputs:
      harness: ${{ steps.harness.outcome }}
      resolve: ${{ steps.resolve.outcome }}
      relation: ${{ steps.resolve.outputs.relation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the resolver proves the deployed commit is an ancestor of this one and
          # lists the files changed between them.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        run: npm ci --include=dev

      # Which commit may this run prove? Read-only: GET /api/health plus local git. Exact on a
      # dispatched release proof; on the nightly and the gate, an earlier deployed commit counts
      # only when no app-watched file changed since it (#3113: an exact-HEAD rule never passed on a
      # schedule). A stale staging app is reported as its own failure, never as a mystery.
      - name: Resolve the staging deployment
        id: resolve
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          CROSS_TENANT_STAGING_APP_URL: ${{ secrets.CROSS_TENANT_STAGING_APP_URL }}
          CROSS_TENANT_CHECKOUT_COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            push) node scripts/resolve-staging-deployment.mjs --allow-equivalent --wait-seconds 1800 ;;
            schedule) node scripts/resolve-staging-deployment.mjs --allow-equivalent --superseded-ok --wait-seconds 900 ;;
            *) node scripts/resolve-staging-deployment.mjs ;;
          esac

      # REPORTS, NEVER BLOCKS, ON THE NIGHTLY SCHEDULE (ledger #HYSWAF, owner decision 2026-10-09).
      # Railway "Wait for CI" skips a production deploy when any Actions run on the waiting commit
      # concludes failure, and this scheduled run checks out main HEAD. It is red every night until
      # staging tracks main (#057), so without this a merge landing near 18:30Z would not deploy.
      # A failure still shows as a failed step and still opens the pinned, assigned issue below.
      # A dispatched run, a deliberate proof, stays blocking, and so does the main-push gate.
      - name: Run cross-tenant staging checks
        id: harness
        if: ${{ steps.resolve.outcome == 'success' && steps.resolve.outputs.relation != 'superseded' }}
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          CROSS_TENANT_STAGING_APP_URL: ${{ secrets.CROSS_TENANT_STAGING_APP_URL }}
          CROSS_TENANT_SUPABASE_URL: ${{ secrets.CROSS_TENANT_SUPABASE_URL }}
          CROSS_TENANT_PROJECT_REF: ${{ secrets.CROSS_TENANT_PROJECT_REF }}
          CROSS_TENANT_PUBLISHABLE_KEY: ${{ secrets.CROSS_TENANT_PUBLISHABLE_KEY }}
          CROSS_TENANT_SERVICE_ROLE_KEY: ${{ secrets.CROSS_TENANT_SERVICE_ROLE_KEY }}
          CROSS_TENANT_USER_A_EMAIL: ${{ secrets.CROSS_TENANT_USER_A_EMAIL }}
          CROSS_TENANT_USER_A_PASSWORD: ${{ secrets.CROSS_TENANT_USER_A_PASSWORD }}
          CROSS_TENANT_USER_B_EMAIL: ${{ secrets.CROSS_TENANT_USER_B_EMAIL }}
          CROSS_TENANT_USER_B_PASSWORD: ${{ secrets.CROSS_TENANT_USER_B_PASSWORD }}
          CROSS_TENANT_DOCUMENT_BUCKET: ${{ vars.CROSS_TENANT_DOCUMENT_BUCKET }}
          CROSS_TENANT_EVIDENCE_PATH: artifacts/staging-tenancy-evidence.json
          CROSS_TENANT_CHECKOUT_COMMIT_SHA: ${{ github.sha }}
          CROSS_TENANT_EXPECTED_DEPLOYED_SHA: ${{ steps.resolve.outputs.deployed_sha }}
          CROSS_TENANT_DEPLOYMENT_RELATION: ${{ steps.resolve.outputs.relation }}
          CROSS_TENANT_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # On schedule, cap the step below the job timeout so a hang becomes a failed step
        # (continue-on-error) rather than a job-level cancel that still fails the workflow.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            timeout 15m npm run test:cross-tenant:staging
          else
            npm run test:cross-tenant:staging
          fi

      # On schedule, `timeout 15m` can SIGTERM the harness before writeEvidence runs, so the
      # evidence file may be absent. Warn (not error) then: continue-on-error on the harness would
      # otherwise be undone by this upload failing the job and still blocking Railway deploys.
      # Dispatched runs stay strict — a deliberate proof must leave evidence.
      - name: Upload tenancy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-tenancy-evidence-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: artifacts/staging-tenancy-evidence.json
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'error' || 'warn' }}
          retention-days: 14

      # A scheduled failure is continue-on-error, so the run itself shows a green tick. This banner
      # and annotation make the one thing that matters impossible to miss: was separation proven?
      - name: Report whether separation was proven
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESOLVE: ${{ steps.resolve.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
          RELATION: ${{ steps.resolve.outputs.relation }}
          DEPLOYED: ${{ steps.resolve.outputs.deployed_sha }}
        run: |
          if [ "$HARNESS" = "success" ]; then
            echo "## Two-user separation PROVEN on staging (${DEPLOYED:-unknown}, ${RELATION:-unknown})" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESOLVE" = "success" ] && [ "$RELATION" = "superseded" ]; then
            echo "## Not tested here: staging already runs a newer app commit (${DEPLOYED:-unknown}); its own run proves it" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT_NAME" = "push" ] && [ "$RELATION" = "superseded" ]; then
            echo "## Held, not released: staging already runs a newer app commit (${DEPLOYED:-unknown}); its own run decides" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Live deploy held::Staging runs a newer commit, so this one was not tested. The newer commit's run decides."
          else
            if [ "$RESOLVE" != "success" ]; then
              reason="staging was not running a provable version (${RELATION:-unreadable}); see the resolve step"
            else
              reason="the harness failed; see the run log and evidence artifact"
            fi
            echo "## Two-user separation NOT proven: ${reason}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Separation NOT proven::${reason}"
          fi

  # The harness failed on every scheduled run from at least 2026-09-21 to 2026-09-25, each time on
  # its deployment-identity check (staging was not running the checked-out commit), and nobody was
  # told: a red scheduled run only sends an email, and the owner has confirmed those are not read
  # (ledger #TN512M). So an unproven tenancy boundary looked the same as a proven one. This routes
  # a failing main run to one pinned, assigned issue, the delivery path live-domain-monitor.yml
  # and live-drift.yml already use, and closes it on the next green run.
  #
  # Split into its own job so `issues: write` never lands on the job that checks out and runs the
  # harness with staging credentials. The issue body names no secret and quotes no log text: the
  # repository is public, so it links the run instead.
  tenancy-routing:
    name: Route tenancy status to the pinned issue
    needs: cross-tenant
    # A push while the gate is off skips the harness job; that is not a tenancy result.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.cross-tenant.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open, update or close the pinned tenancy issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # A failed harness step reads `failure` here even when continue-on-error kept the job green.
          HARNESS_RESULT: ${{ needs.cross-tenant.result == 'success' && needs.cross-tenant.outputs.harness || needs.cross-tenant.result }}
          RESOLVE_RESULT: ${{ needs.cross-tenant.outputs.resolve }}
          RELATION: ${{ needs.cross-tenant.outputs.relation }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            // Owner decision 2026-10-21 (docs/decisions/2026-10-21-one-daily-health-summary.md): this
            // workflow no longer @mentions or assigns the owner. Its result reaches the owner's phone once a
            // day in the daily health summary (.github/workflows/daily-health-summary.yml), which reads this
            // issue's label; the issue keeps the detail.

            const title = "Staging tenancy isolation check failing";
            const label = "staging-tenancy-failure";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // A newer staging commit's own run carries the verdict; this run neither opens nor closes the alert.
            // Only a passed resolve (the nightly) or the gate's deliberate hold: a strict release proof that
            // met a newer commit is a failure and still alerts.
            const supersededHold = process.env.RESOLVE_RESULT === "success" || process.env.EVENT_NAME === "push";
            if (process.env.RELATION === "superseded" && supersededHold) {
              core.info("Staging already runs a newer app commit; its run reports the result.");
              return;
            }
            const result = process.env.HARNESS_RESULT || "unknown";
            const now = new Date().toISOString();

            // One pinned issue, found by label so a retitle by a human does not start a second one.
            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
            });
            const existing = open.find((issue) => issue.title === title) ?? open[0];

            if (result === "success") {
              if (!existing) {
                core.info("Staging tenancy check is green and no failure issue is open.");
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Resolved — the staging tenancy check is green again as of ${now}.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${existing.number} after a green tenancy run.`);
              return;
            }

            const body = [
              "The two-user staging tenancy check did not pass. This issue is updated in place by",
              "`.github/workflows/staging-tenancy.yml` and closes automatically on the next green run,",
              "so while it is open, per-user isolation has **not** been proven on the staging app.",
              "",
              `- Latest failing run: ${runUrl}`,
              `- Job result: \`${result}\``,
              `- Staging version check: \`${process.env.RESOLVE_RESULT || "unknown"}\` (failure means staging was stale or unreadable, so nothing was tested)`,
              `- Trigger: \`${context.eventName}\``,
              `- Last updated: ${now}`,
              "",
              "The most common cause is the deployment-identity check: the harness only runs when the",
              "staging app reports the same commit it checked out, and staging is not redeployed on",
              "every push to main. The run log says which check stopped it. See",
              "`docs/staging-setup.md` (Validate staging) and `docs/staging-tenancy-release-evidence.md`.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              // A main push can fail the gate several times a day while staging is down. The body
              // above carries the latest run; only the nightly and a dispatched proof re-mention the
              // owner, so one outage pushes one phone alert a day, not one per merge.
              if (context.eventName === "push") {
                core.warning(`Staging gate failing; updated #${existing.number} without a new mention.`);
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still failing as of ${now} — ${runUrl}`,
              });
              core.warning(`Staging tenancy check failing; updated #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [label],
                body,
              });
              core.warning(`Staging tenancy check failing; opened #${created.data.number}.`);
            }
