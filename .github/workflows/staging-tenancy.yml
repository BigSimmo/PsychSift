name: Staging tenancy isolation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

concurrency:
  group: staging-tenancy-isolation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross-tenant:
    name: Cross-tenant staging harness
    runs-on: ubuntu-24.04
    # Job ceiling stays above the scheduled step's 15-minute `timeout` so a hung harness
    # exits as a failed step (absorbable by continue-on-error) instead of GitHub killing the
    # whole job — which continue-on-error cannot soften and which would still fail the run.
    timeout-minutes: 45
    # The routing job reads the harness step's own outcome, because a continue-on-error step
    # leaves the job reporting `success` through `needs`.
    outputs:
      harness: ${{ steps.harness.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        run: npm ci --include=dev

      # REPORTS, NEVER BLOCKS, ON THE NIGHTLY SCHEDULE (ledger #HYSWAF, owner decision 2026-10-09).
      # Railway "Wait for CI" skips a production deploy when any Actions run on the waiting commit
      # concludes failure, and this scheduled run checks out main HEAD. It is red every night until
      # staging tracks main (#057), so without this a merge landing near 18:30Z would not deploy.
      # A failure still shows as a failed step and still opens the pinned, assigned issue below.
      # A dispatched run, a deliberate proof, stays blocking.
      - name: Run cross-tenant staging checks
        id: harness
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          CROSS_TENANT_STAGING_APP_URL: ${{ secrets.CROSS_TENANT_STAGING_APP_URL }}
          CROSS_TENANT_SUPABASE_URL: ${{ secrets.CROSS_TENANT_SUPABASE_URL }}
          CROSS_TENANT_PROJECT_REF: ${{ secrets.CROSS_TENANT_PROJECT_REF }}
          CROSS_TENANT_PUBLISHABLE_KEY: ${{ secrets.CROSS_TENANT_PUBLISHABLE_KEY }}
          CROSS_TENANT_SERVICE_ROLE_KEY: ${{ secrets.CROSS_TENANT_SERVICE_ROLE_KEY }}
          CROSS_TENANT_USER_A_EMAIL: ${{ secrets.CROSS_TENANT_USER_A_EMAIL }}
          CROSS_TENANT_USER_A_PASSWORD: ${{ secrets.CROSS_TENANT_USER_A_PASSWORD }}
          CROSS_TENANT_USER_B_EMAIL: ${{ secrets.CROSS_TENANT_USER_B_EMAIL }}
          CROSS_TENANT_USER_B_PASSWORD: ${{ secrets.CROSS_TENANT_USER_B_PASSWORD }}
          CROSS_TENANT_DOCUMENT_BUCKET: ${{ vars.CROSS_TENANT_DOCUMENT_BUCKET }}
          CROSS_TENANT_EVIDENCE_PATH: artifacts/staging-tenancy-evidence.json
          CROSS_TENANT_CHECKOUT_COMMIT_SHA: ${{ github.sha }}
          CROSS_TENANT_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # On schedule, cap the step below the job timeout so a hang becomes a failed step
        # (continue-on-error) rather than a job-level cancel that still fails the workflow.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            timeout 15m npm run test:cross-tenant:staging
          else
            npm run test:cross-tenant:staging
          fi

      - name: Upload tenancy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-tenancy-evidence-${{ github.run_id }}
          path: artifacts/staging-tenancy-evidence.json
          if-no-files-found: error
          retention-days: 14

  # The harness failed on every scheduled run from at least 2026-09-21 to 2026-09-25, each time on
  # its deployment-identity check (staging was not running the checked-out commit), and nobody was
  # told: a red scheduled run only sends an email, and the owner has confirmed those are not read
  # (ledger #TN512M). So an unproven tenancy boundary looked the same as a proven one. This routes
  # a failing main run to one pinned, assigned issue, the delivery path live-domain-monitor.yml
  # and live-drift.yml already use, and closes it on the next green run.
  #
  # Split into its own job so `issues: write` never lands on the job that checks out and runs the
  # harness with staging credentials. The issue body names no secret and quotes no log text: the
  # repository is public, so it links the run instead.
  tenancy-routing:
    name: Route tenancy status to the pinned issue
    needs: cross-tenant
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open, update or close the pinned tenancy issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # A failed harness step reads `failure` here even when continue-on-error kept the job green.
          HARNESS_RESULT: ${{ needs.cross-tenant.result == 'success' && needs.cross-tenant.outputs.harness || needs.cross-tenant.result }}
        with:
          script: |
            // Route the alert to a person, not only a label (#TN512M): GitHub notifies an issue's
            // assignee on their phone. Best-effort, so a refused assignment never costs the alert.
            const alertAssignee = context.repo.owner;
            async function assignAlert(issueNumber) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [alertAssignee],
                });
              } catch (error) {
                core.warning(`Could not assign @${alertAssignee} to #${issueNumber}: ${error.message}`);
              }
            }

            const title = "Staging tenancy isolation check failing";
            const label = "staging-tenancy-failure";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.HARNESS_RESULT || "unknown";
            const now = new Date().toISOString();

            // One pinned issue, found by label so a retitle by a human does not start a second one.
            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
            });
            const existing = open.find((issue) => issue.title === title) ?? open[0];

            if (result === "success") {
              if (!existing) {
                core.info("Staging tenancy check is green and no failure issue is open.");
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Resolved — the staging tenancy check is green again as of ${now}.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${existing.number} after a green tenancy run.`);
              return;
            }

            const body = [
              "The two-user staging tenancy check did not pass. This issue is updated in place by",
              "`.github/workflows/staging-tenancy.yml` and closes automatically on the next green run,",
              "so while it is open, per-user isolation has **not** been proven on the staging app.",
              "",
              `- Latest failing run: ${runUrl}`,
              `- Job result: \`${result}\``,
              `- Trigger: \`${context.eventName}\``,
              `- Last updated: ${now}`,
              "",
              "The most common cause is the deployment-identity check: the harness only runs when the",
              "staging app reports the same commit it checked out, and staging is not redeployed on",
              "every push to main. The run log says which check stopped it. See",
              "`docs/staging-setup.md` (Validate staging) and `docs/staging-tenancy-release-evidence.md`.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still failing as of ${now} — ${runUrl}`,
              });
              await assignAlert(existing.number);
              core.warning(`Staging tenancy check failing; updated #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [label],
                body,
              });
              await assignAlert(created.data.number);
              core.warning(`Staging tenancy check failing; opened #${created.data.number}.`);
            }
