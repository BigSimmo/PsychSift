name: Live drift check

# Live Supabase drift detection is useful, but it must not slow PR iteration or
# touch live services on every branch. Keep it off pull requests entirely: it runs
# on a schedule, on demand, and once a schema change actually reaches main.
on:
  workflow_dispatch:
  schedule:
    # Weekly, aligned with the existing Sunday off-peak CI cadence.
    - cron: "30 18 * * 0"
  push:
    # A migration landing on main is the event most likely to cause drift, so
    # check within minutes of it rather than waiting up to a week for the cron.
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/schema.sql"

concurrency:
  group: live-drift-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://sjrfecxgysukkwxsowpy.supabase.co
      SUPABASE_PROJECT_REF: sjrfecxgysukkwxsowpy
      SUPABASE_PROJECT_NAME: PsychSift Production
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    outputs:
      # Consumed by drift-routing below. Job outputs survive a failed job as long
      # as the step that set them ran, which is why the capture step is always().
      findings: ${{ steps.findings.outputs.findings }}
      # What was actually compared, and against which database. A green run used
      # to publish "the live drift check is green again" carrying none of this,
      # so the comment that CLOSED the issue was the one piece of evidence in the
      # thread that said nothing about what had been checked.
      comparison: ${{ steps.findings.outputs.comparison }}
      history: ${{ steps.findings.outputs.history }}
      project_ref: ${{ steps.findings.outputs.project_ref }}
      checked_sha: ${{ steps.findings.outputs.checked_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight required secrets
        run: |
          missing=""
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Live drift check cannot run - missing repo secrets:$missing"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          # Same key as .github/actions/setup-node-cached (lockfile + .nvmrc): reuse the ~/.npm that
          # CI's npm ci jobs save, never the lockfile-only key a bare setup-node step can fill empty.
          cache-dependency-path: |
            package-lock.json
            .nvmrc

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Guard Supabase project identity
        run: npm run check:supabase-project

      # This runs BEFORE the drift comparison and in a wide wait-until-applied
      # mode. On a push trigger this job starts within seconds of the merge, but
      # the Supabase GitHub integration applies migrations out-of-band (measured
      # ~34 s); three of four push-triggered runs sampled on 2026-09-16 read the
      # live schema mid-apply and reported false drift (a constraint read as
      # null mid drop/re-add, a function hash captured before its migration
      # applied). check:migration-history already retries when a local migration
      # version is not yet in live history (see PENDING_SETTLE_ATTEMPTS in
      # scripts/check-migration-history-alignment.ts); `--max-wait-ms` widens
      # that budget from the check's own ~90s default to ten minutes so the
      # schema has settled before check:drift ever samples it. This still fails
      # exactly as before if migrations are genuinely never applied within that
      # window — it only waits longer before giving up.
      - name: Align migration history for Supabase Preview
        id: migration-history
        run: |
          set -o pipefail
          npm run check:migration-history -- --max-wait-ms 600000 2>&1 | tee migration-history-output.txt

      - name: Compare live schema drift
        id: drift
        if: ${{ !cancelled() }}
        run: |
          # The default step shell is `bash -e`, which has no pipefail, so a
          # failing check:drift would be masked by tee's exit code without this.
          set -o pipefail
          npm run check:drift 2>&1 | tee drift-output.txt

      - name: Capture drift and migration-history findings
        id: findings
        if: always()
        run: |
          # Capture whichever output files exist: migration-history always runs
          # first, and drift still runs (if: !cancelled()) even after a
          # migration-history failure, so a reader sees both checks' evidence
          # rather than one check's failure standing in for the other's result.
          {
            echo "findings<<LIVE_DRIFT_FINDINGS_EOF"
            if [ -f drift-output.txt ]; then
              grep -E '^(Drift manifest:|Compared |UNEXPECTED DRIFT|  ! \[|  \? \[)' drift-output.txt | head -80 || true
            fi
            if [ -f migration-history-output.txt ]; then
              echo "Migration-history check output:"
              tail -80 migration-history-output.txt
            fi
            echo "LIVE_DRIFT_FINDINGS_EOF"
          } >> "$GITHUB_OUTPUT"

          # The two lines that say WHAT was compared, carried separately so the
          # green path can publish them. check:drift prints "Drift manifest: …"
          # and "Compared N extensions, N tables, …" before any verdict; an
          # absent pair means the comparison never reached that point, which is
          # not the same as finding nothing.
          {
            echo "comparison<<LIVE_DRIFT_COMPARISON_EOF"
            if [ -f drift-output.txt ]; then
              grep -E '^(Drift manifest:|Compared )' drift-output.txt | head -4 || true
            fi
            echo "LIVE_DRIFT_COMPARISON_EOF"
            echo "history<<LIVE_DRIFT_HISTORY_EOF"
            if [ -f migration-history-output.txt ]; then
              grep -E '^(Local migration versions:|Remote migration versions:|Remote-only|Local-only|Migration history alignment)' migration-history-output.txt | head -8 || true
            fi
            echo "LIVE_DRIFT_HISTORY_EOF"
            echo "project_ref=${SUPABASE_PROJECT_REF}"
            echo "checked_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The issue gets a bounded head -80 / tail -80 slice; everything past that
      # was lost with the runner. A real drift report can be hundreds of lines and
      # the truncated tail is exactly where the unexplained entries sit.
      - name: Upload full drift diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-drift-diagnostics
          path: |
            drift-output.txt
            migration-history-output.txt
          retention-days: 30
          # `warn`, not `error`: a preflight or install failure legitimately
          # produces neither file, and that job has already failed for a reason
          # the run log states. Turning that into a second failure would just
          # obscure the first.
          if-no-files-found: warn

  # Split out so issues: write is scoped to a job that never installs or executes
  # repository code — the drift job above keeps contents: read only.
  drift-routing:
    needs: live-drift
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Route drift status to the pinned issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_RESULT: ${{ needs.live-drift.result }}
          DRIFT_FINDINGS: ${{ needs.live-drift.outputs.findings }}
          DRIFT_COMPARISON: ${{ needs.live-drift.outputs.comparison }}
          DRIFT_HISTORY: ${{ needs.live-drift.outputs.history }}
          DRIFT_PROJECT_REF: ${{ needs.live-drift.outputs.project_ref }}
          DRIFT_CHECKED_SHA: ${{ needs.live-drift.outputs.checked_sha }}
        with:
          script: |
            const title = "Live drift check failing";
            const label = "live-drift-failure";
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const result = process.env.DRIFT_RESULT || "unknown";
            const findings = (process.env.DRIFT_FINDINGS || "").trim();
            const comparison = (process.env.DRIFT_COMPARISON || "").trim();
            const history = (process.env.DRIFT_HISTORY || "").trim();
            const projectRef = (process.env.DRIFT_PROJECT_REF || "").trim() || "unrecorded";
            const checkedSha = (process.env.DRIFT_CHECKED_SHA || "").trim();
            const now = new Date().toISOString();
            // Stable marker written into every body this workflow authors, so a
            // human retitling the issue does not orphan it AND a green run has
            // something safer than "first open issue with the label" to match on.
            const MARKER = "<!-- live-drift-routing:v1 -->";

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
            });
            // Ownership, in descending confidence: this workflow's own marker,
            // then the exact title. `?? open[0]` used to be the last fallback —
            // harmless when UPDATING a body, but on the green path it CLOSES
            // whatever it picked, and any open issue carrying this label
            // qualified. Closing someone else's issue is not recoverable by a
            // workflow, so the fallback is gone from the matching entirely.
            const owned = (issue) => String(issue.body ?? "").includes(MARKER) || issue.title === title;
            const existing = open.find(owned) ?? null;

            if (result === "success") {
              if (!existing) {
                const skipped = open.length > 0 ? ` (${open.length} labelled issue(s) are not this workflow's)` : "";
                core.info(`Live drift check is green and no failure issue of ours is open${skipped}.`);
                return;
              }
              // A green run used to say only "green again" — the one comment in
              // the thread that closed it carried no statement of what had been
              // compared, against which database, at which commit. "The job
              // exited 0" is a fact about the job, not about the schema.
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: [
                  `Resolved — the live drift check is green again as of ${now}.`,
                  "",
                  `- Run: ${runUrl}`,
                  `- Project: \`${projectRef}\``,
                  checkedSha ? `- Checked-out commit: \`${checkedSha.slice(0, 12)}\`` : "- Checked-out commit: unrecorded",
                  "",
                  comparison
                    ? `### What was compared\n\n\`\`\`\n${comparison}\n\`\`\``
                    : "### What was compared\n\n⚠ The comparison summary was not captured, so this green result states that the job exited cleanly and **not** what it compared. Read the run log before treating this as parity.",
                  history ? `\n### Migration history\n\n\`\`\`\n${history}\n\`\`\`` : "",
                  "",
                  "Schema parity is an object-inventory comparison. Data, cron and configuration",
                  "effects are not represented in it.",
                  MARKER,
                ].join("\n"),
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${existing.number} after a green live drift run.`);
              return;
            }

            // Route the alert to a person, not only a label (#TN512M): GitHub notifies an issue's
            // assignee on their phone, for the opening and for every later comment. Best-effort, so
            // a refused assignment can never cost the alert itself.
            const alertAssignee = context.repo.owner;
            async function assignAlert(issueNumber) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  assignees: [alertAssignee],
                });
              } catch (error) {
                core.warning(`Could not assign @${alertAssignee} to #${issueNumber}: ${error.message}`);
              }
            }

            const body = [
              "The live Supabase drift check is failing. This issue is updated in place by",
              "`.github/workflows/live-drift.yml`; it is closed automatically on the next green run.",
              "",
              `- Latest failing run: ${runUrl}`,
              `- Job result: \`${result}\``,
              `- Trigger: \`${context.eventName}\``,
              `- Project: \`${projectRef}\``,
              checkedSha ? `- Checked-out commit: \`${checkedSha.slice(0, 12)}\`` : "- Checked-out commit: unrecorded",
              `- Last updated: ${now}`,
              "",
              "Full untruncated output is the `live-drift-diagnostics` artifact on the run above;",
              "the findings below are a bounded slice.",
              "",
              findings
                ? `### Drift findings\n\n\`\`\`\n${findings}\n\`\`\``
                : "### Drift findings\n\nNone captured — the run failed before the drift comparison ran, so this is **not** evidence of a clean schema. Read the run log linked above.",
              "",
              "Remediation context: `docs/database-remediation-plan.md`, `docs/database-drift-detection.md`.",
              "Never fix drift with raw SQL against live — codify it (migration + `schema.sql` mirror + regenerated manifest).",
              MARKER,
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Still failing as of ${now} — ${runUrl}`,
              });
              await assignAlert(existing.number);
              core.warning(`Live drift check failing; updated #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [label],
                body,
              });
              await assignAlert(created.data.number);
              core.warning(`Live drift check failing; opened #${created.data.number}.`);
            }
